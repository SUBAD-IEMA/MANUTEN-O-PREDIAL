/* =========================================================================
   Gestão de Manutenção Predial — IEMA
   Identidade: verde institucional + as sete cores das etapas da IS
   ========================================================================= */
:root {
  --brand: #0B4F4A;
  --brand-deep: #083B37;
  --brand-ink: #E6F4F1;
  --accent: #0F766E;
  --bg: #F2F5F4;
  --surface: #FFFFFF;
  --surface-2: #EBF0EE;
  --surface-3: #E1E8E6;
  --ink: #14232A;
  --ink-2: #33464C;
  --muted: #5E7075;
  --line: #D5DEDB;
  --line-2: #C3CFCB;
  --focus: #0EA5A0;

  --e1: #1D4ED8; --e2: #6D28D9; --e3: #0F766E; --e4: #BE123C; --e5: #475569; --e6: #15803D; --e7: #C2410C; --e8: #0B4F4A;

  --ok: #15803D; --ok-bg: #DCFCE7;
  --warn: #A16207; --warn-bg: #FEF3C7;
  --bad: #B91C1C; --bad-bg: #FEE2E2;
  --info: #1D4ED8; --info-bg: #DBEAFE;
  --neutral-bg: #E2E8F0;

  --r-lg: 14px; --r-md: 9px; --r-sm: 6px;
  --shadow: 0 1px 2px rgba(20, 35, 42, .06), 0 6px 18px -10px rgba(20, 35, 42, .18);
  --font: "Public Sans", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --side: 248px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C1514; --surface: #13201E; --surface-2: #1A2a27; --surface-3: #223532;
    --ink: #E4EEEC; --ink-2: #C3D2CF; --muted: #8FA3A0; --line: #263835; --line-2: #33504b; --focus: #2DD4BF;
    --ok-bg: #12301f; --warn-bg: #33270b; --bad-bg: #3a1515; --info-bg: #14234a; --neutral-bg: #233130;
    --ok: #4ADE80; --warn: #FBBF24; --bad: #F87171; --info: #93C5FD;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 20px -12px rgba(0, 0, 0, .6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C1514; --surface: #13201E; --surface-2: #1A2a27; --surface-3: #223532;
  --ink: #E4EEEC; --ink-2: #C3D2CF; --muted: #8FA3A0; --line: #263835; --line-2: #33504b; --focus: #2DD4BF;
  --ok-bg: #12301f; --warn-bg: #33270b; --bad-bg: #3a1515; --info-bg: #14234a; --neutral-bg: #233130;
  --ok: #4ADE80; --warn: #FBBF24; --bad: #F87171; --info: #93C5FD;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 20px -12px rgba(0, 0, 0, .6);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
body {
  font-family: var(--font); font-size: 15px; line-height: 1.5; color: var(--ink); background: var(--bg);
  -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums;
}
h1, h2, h3, h4 { margin: 0; line-height: 1.2; font-weight: 700; letter-spacing: -0.01em; }
p { margin: 0; }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* ---------------- Estrutura ---------------- */
.app { display: grid; grid-template-columns: var(--side) 1fr; min-height: 100vh; }
.side {
  background: var(--brand-deep); color: var(--brand-ink); position: sticky; top: 0; height: 100vh;
  display: flex; flex-direction: column; padding: 22px 14px 16px; overflow-y: auto;
}
.brand { padding: 0 8px 18px; border-bottom: 1px solid rgba(255, 255, 255, .1); margin-bottom: 14px; }
.brand-name { font-size: 17px; font-weight: 800; color: #fff; line-height: 1.15; }
.brand-org { font-size: 12.5px; color: #9CCFC7; margin-top: 4px; }
.brand-track { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; margin-top: 14px; }
.brand-track i { height: 5px; border-radius: 3px; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav a {
  display: flex; align-items: center; gap: 11px; padding: 9px 10px; border-radius: var(--r-md);
  color: #CFE6E1; text-decoration: none; font-weight: 500; font-size: 14.5px;
}
.nav a svg { width: 18px; height: 18px; flex: none; opacity: .85; }
.nav a:hover { background: rgba(255, 255, 255, .07); color: #fff; }
.nav a[aria-current="page"] { background: #fff; color: var(--brand-deep); font-weight: 700; }
.nav a[aria-current="page"] svg { opacity: 1; }
.nav .sep { height: 1px; background: rgba(255, 255, 255, .1); margin: 10px 6px; }
.nav .gestor { color: #FDE68A; }
.nav .gestor[aria-current="page"] { color: var(--brand-deep); }
.side-foot { margin-top: auto; padding: 14px 8px 0; font-size: 12px; color: #8CBDB5; }
.side-foot b { color: #CFE6E1; font-weight: 600; }

.main { min-width: 0; display: flex; flex-direction: column; }
.top {
  position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(8px); border-bottom: 1px solid var(--line);
  display: flex; align-items: center; gap: 12px; padding: 12px 28px;
}
.top h1 { font-size: 21px; }
.top .sub { color: var(--muted); font-size: 13.5px; }
.top-spacer { flex: 1; }
.search { position: relative; }
.search input {
  width: 260px; padding: 8px 12px 8px 34px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--surface);
}
.search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--muted); }
.btn.menu-btn { display: none; }
.view { padding: 24px 28px 48px; max-width: 1480px; width: 100%; }

/* ---------------- Botões e campos ---------------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 8px 14px; border-radius: var(--r-md);
  border: 1px solid var(--line-2); background: var(--surface); color: var(--ink); font-weight: 600; font-size: 14px;
  cursor: pointer; white-space: nowrap; text-decoration: none; line-height: 1.2;
}
.btn:hover { background: var(--surface-2); }
.btn svg { width: 16px; height: 16px; }
.btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
.btn.primary:hover { background: var(--brand-deep); }
.btn.danger { color: var(--bad); border-color: rgba(185, 28, 28, .4); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--surface-2); }
.btn.sm { padding: 5px 10px; font-size: 13px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.icon-btn { width: 36px; height: 36px; padding: 0; border-radius: 999px; }

label.f, div.f { display: flex; flex-direction: column; gap: 5px; font-size: 13px; font-weight: 600; color: var(--ink-2); }
label.f .hint { font-weight: 400; color: var(--muted); font-size: 12px; }
.in, select.in, textarea.in {
  width: 100%; padding: 8px 10px; border-radius: var(--r-sm); border: 1px solid var(--line-2); background: var(--surface);
  font-weight: 400; font-size: 14px;
}
textarea.in { min-height: 84px; resize: vertical; }
.in:focus { outline: 2px solid var(--focus); outline-offset: 0; border-color: transparent; }
.in[aria-invalid="true"] { border-color: var(--bad); box-shadow: 0 0 0 1px var(--bad); }
.req::after { content: " *"; color: var(--bad); }
.check { display: flex; align-items: flex-start; gap: 9px; font-size: 14px; cursor: pointer; }
.check input { margin-top: 3px; width: 16px; height: 16px; accent-color: var(--brand); }

/* ---------------- Blocos ---------------- */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow); }
.panel-h { display: flex; align-items: baseline; justify-content: space-between; gap: 4px 12px; padding: 16px 18px 0; flex-wrap: wrap; }
.panel-h h2 { font-size: 16px; }
.panel-h .meta { color: var(--muted); font-size: 13px; }
.panel-b { padding: 14px 18px 18px; }
.grid { display: grid; gap: 18px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g-main { grid-template-columns: minmax(0, 1.65fr) minmax(0, 1fr); }
.stack { display: flex; flex-direction: column; gap: 18px; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.right { text-align: right; }
.nowrap { white-space: nowrap; }
.empty { padding: 28px; text-align: center; color: var(--muted); }
.empty b { display: block; color: var(--ink); font-size: 15px; margin-bottom: 4px; }


/* ---------------- Container queries para painéis ---------------- */
.panel { container-type: inline-size; }

/* KPIs */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 14px 16px; box-shadow: var(--shadow); border-top: 3px solid var(--c, var(--brand)); min-width: 0; }
.kpi .l { font-size: 13px; color: var(--muted); font-weight: 600; }
.kpi .v { font-size: clamp(17px, 1.42vw, 24px); font-weight: 800; letter-spacing: -0.02em; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi .s { font-size: 12.5px; color: var(--muted); }
.kpi .cmp { font-size: 12px; margin-top: 4px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; color: var(--muted); }
.delta { font-weight: 700; padding: 0 6px; border-radius: 999px; font-size: 11.5px; }
.delta.up { background: var(--ok-bg); color: var(--ok); } .delta.down { background: var(--bad-bg); color: var(--bad); } .delta.eq { background: var(--neutral-bg); color: var(--muted); }
.delta.inv.up { background: var(--bad-bg); color: var(--bad); } .delta.inv.down { background: var(--ok-bg); color: var(--ok); }

/* Selos */
.tag { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px; font-size: 12.5px; font-weight: 600; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.tag .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex: none; }
.tag.ok, .tag.concluida { background: var(--ok-bg); color: var(--ok); }
.tag.atencao, .tag.concluida-atraso { background: var(--warn-bg); color: var(--warn); }
.tag.atrasada, .tag.alerta { background: var(--bad-bg); color: var(--bad); }
.tag.neutro { background: var(--neutral-bg); color: var(--muted); }
.tag.mod { background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line); }
.sit { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: var(--ink-2); white-space: nowrap; }
.sit i { width: 9px; height: 9px; border-radius: 50%; background: var(--c); flex: none; }

/* Mini-andamento (5 marcas) */
.marks { display: inline-flex; gap: 3px; }
.marks i { width: 18px; height: 6px; border-radius: 3px; background: var(--surface-3); }
.marks i.on { background: var(--accent); }
.marks i.na { background: transparent; border: 1px dashed var(--line-2); height: 4px; margin-top: 1px; }

/* ---------------- Tabelas ---------------- */
.table-wrap { overflow-x: auto; }
table.t { width: 100%; border-collapse: collapse; font-size: 14px; }
.t th { text-align: left; font-size: 12.5px; color: var(--muted); font-weight: 700; padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--surface); }
.t th button { all: unset; cursor: pointer; display: inline-flex; gap: 4px; align-items: center; }
.t th button:focus-visible { outline: 2px solid var(--focus); }
.t th.right, .t td.right { text-align: right; }
.t td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.t tbody tr.click { cursor: pointer; }
.t tbody tr.click:hover td { background: var(--surface-2); }
.t .id { font-weight: 700; font-size: 13px; color: var(--ink-2); white-space: nowrap; }
.t .tt { font-weight: 600; max-width: 380px; }
.t .sub { font-size: 12.5px; color: var(--muted); }
.t tfoot td { font-weight: 700; border-bottom: 0; border-top: 2px solid var(--line-2); }
.t td a { white-space: nowrap; }
.t tr.grupo td { background: var(--surface-2); font-weight: 700; font-size: 13px; }
.t tr.filho td:first-child { padding-left: 28px; }

.filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.filters label.f { min-width: 150px; flex: 1 1 150px; max-width: 220px; }
.filters .grow { flex: 2 1 240px; max-width: none; }
.count { font-size: 13px; color: var(--muted); padding: 10px 18px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: center; }

.seg { display: inline-flex; background: var(--surface-2); border-radius: var(--r-md); padding: 3px; gap: 2px; border: 1px solid var(--line); flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 6px 12px; border-radius: 7px; font-weight: 600; font-size: 13.5px; cursor: pointer; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }

/* ---------------- Período e comparação ---------------- */
.periodo { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; padding: 14px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow); }
.periodo label.f { min-width: 140px; flex: 0 1 190px; }
.periodo .resumo { flex: 1 1 220px; font-size: 13px; color: var(--muted); align-self: center; text-align: right; }
.periodo .resumo b { color: var(--ink); }

/* ---------------- Gráficos ---------------- */
.chart { width: 100%; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart text { fill: var(--muted); font-family: var(--font); font-size: 11px; }
.chart .lbl { fill: var(--ink-2); font-weight: 600; }
.chart .val { fill: var(--ink); font-weight: 700; }
.chart .axis { stroke: var(--line-2); }
.chart .grid-l { stroke: var(--line); stroke-dasharray: 2 3; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12.5px; color: var(--ink-2); margin-top: 10px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; min-width: 0; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex: none; }
.donut-wrap { display: grid; grid-template-columns: minmax(120px, 160px) 1fr; gap: 18px; align-items: center; }
.donut-wrap .legend { flex-direction: column; margin: 0; gap: 7px; }
.donut-wrap .legend span { width: 100%; justify-content: flex-start; }
.donut-wrap .legend b { margin-left: auto; padding-left: 10px; white-space: nowrap; }
@container (max-width: 400px) { .donut-wrap { grid-template-columns: 1fr; justify-items: center; } .donut-wrap .chart { max-width: 170px; } .donut-wrap .legend { width: 100%; } }
.bars { display: flex; flex-direction: column; gap: 10px; }
.bar-row { display: grid; grid-template-columns: minmax(90px, 36%) 1fr minmax(64px, auto); gap: 10px; align-items: center; font-size: 13px; }
.bar-row .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink-2); font-weight: 600; }
.bar-row .bg { height: 12px; background: var(--surface-2); border-radius: 999px; overflow: hidden; display: flex; }
.bar-row .bg i { height: 100%; }
.bar-row .nv { font-weight: 700; text-align: right; white-space: nowrap; }
@container (max-width: 420px) { .bar-row { grid-template-columns: 1fr auto; } .bar-row .bg { grid-column: 1 / -1; order: 3; } }

/* Medidor de saldo */
.meter { display: grid; gap: 6px; }
.meter .m-top { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; flex-wrap: wrap; }
.meter .m-top b { font-size: 14px; }
.meter .track { position: relative; height: 14px; background: var(--surface-2); border-radius: 999px; overflow: hidden; border: 1px solid var(--line); }
.meter .track i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); border-radius: 999px; }
.meter.alerta .track i { background: var(--bad); }
.meter .track u { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--ink-2); opacity: .55; }
.meter .m-bot { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); gap: 10px; flex-wrap: wrap; }

/* Comparação */
.cmp-rows { display: flex; flex-direction: column; gap: 14px; }
.cmp-row { display: grid; grid-template-columns: minmax(130px, 28%) 1fr auto; gap: 12px; align-items: center; font-size: 13px; }
.cmp-row .nm { font-weight: 600; color: var(--ink-2); }
.cmp-row .bb { display: flex; flex-direction: column; gap: 4px; }
.cmp-row .bb span { display: grid; grid-template-columns: 1fr minmax(84px, auto); gap: 8px; align-items: center; }
.cmp-row .bb i { display: block; height: 9px; border-radius: 999px; }
.cmp-row .bb em { font-style: normal; font-size: 12px; text-align: right; white-space: nowrap; }
@container (max-width: 480px) { .cmp-row { grid-template-columns: 1fr auto; } .cmp-row .bb { grid-column: 1 / -1; } }

/* Listas e alertas */
.list { display: flex; flex-direction: column; }
.li { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; padding: 10px 2px; border-bottom: 1px solid var(--line); }
.li.click { cursor: pointer; } .li.click:hover { background: var(--surface-2); }
.li:last-child { border-bottom: 0; }
.li .date { text-align: center; min-width: 46px; border-radius: 8px; padding: 4px 6px; background: var(--surface-2); }
.li .date b { display: block; font-size: 17px; line-height: 1.1; }
.li .date span { font-size: 11px; color: var(--muted); }
.li .tt { font-weight: 600; font-size: 14px; }
.li .sub { font-size: 12.5px; color: var(--muted); }
.alert { display: grid; grid-template-columns: 5px 1fr auto; gap: 12px; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--surface); align-items: center; }
.alert.click { cursor: pointer; } .alert.click:hover { background: var(--surface-2); }
.alert .bar { align-self: stretch; border-radius: 3px; background: var(--muted); }
.alert.alto .bar { background: var(--bad); } .alert.medio .bar { background: #D97706; } .alert.baixo .bar { background: var(--info); }
.alert .tt { font-weight: 700; font-size: 14px; }
.alert .sub { font-size: 13px; color: var(--muted); }
.banner { display: flex; gap: 12px; align-items: flex-start; padding: 12px 16px; border-radius: var(--r-md); background: var(--bad-bg); color: var(--bad); border: 1px solid rgba(185, 28, 28, .3); font-size: 14px; }
.banner b { display: block; }
.banner ul { margin: 4px 0 0; padding-left: 18px; }
.banner.warn { background: var(--warn-bg); color: var(--warn); border-color: rgba(161, 98, 7, .3); }

/* Gestor */
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 20px; overflow-x: auto; }
.tabs button { border: 0; background: transparent; padding: 10px 14px; font-weight: 600; color: var(--muted); cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -1px; white-space: nowrap; font-size: 14.5px; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--brand); }
.reports { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
.rep-card { text-align: left; padding: 12px 14px; border-radius: var(--r-md); border: 1px solid var(--line); background: var(--surface); cursor: pointer; display: flex; flex-direction: column; gap: 3px; border-left: 4px solid var(--c); }
.rep-card:hover { background: var(--surface-2); }
.rep-card[aria-pressed="true"] { outline: 2px solid var(--c); }
.rep-card b { font-size: 14px; } .rep-card span { font-size: 12.5px; color: var(--muted); }
.rep-grupo { font-size: 13px; font-weight: 700; color: var(--muted); margin: 6px 0 2px; }

/* Documento de relatório: sempre em papel branco e ajustado à largura da página */
.doc {
  --bg: #fff; --surface: #fff; --surface-2: #EEF2F1; --surface-3: #E1E8E6; --ink: #14232A; --ink-2: #33464C; --muted: #4B5C61; --line: #D5DEDB; --line-2: #B9C6C2;
  --ok: #15803D; --ok-bg: #DCFCE7; --warn: #A16207; --warn-bg: #FEF3C7; --bad: #B91C1C; --bad-bg: #FEE2E2; --info: #1D4ED8; --info-bg: #DBEAFE; --neutral-bg: #E2E8F0; --accent: #0F766E;
  background: #fff; color: #14232A; border: 1px solid var(--line); border-radius: var(--r-lg); padding: 32px 36px; box-shadow: var(--shadow); max-width: 100%; overflow: hidden;
}
.doc .panel { box-shadow: none; }
.doc-h { display: flex; justify-content: space-between; gap: 20px; border-bottom: 3px solid #0B4F4A; padding-bottom: 14px; margin-bottom: 22px; }
.doc-h .org { font-size: 12.5px; color: #4B5C61; font-weight: 600; overflow-wrap: anywhere; }
.doc-h h2 { font-size: 22px; margin-top: 4px; }
.doc-h .gen { font-size: 12.5px; color: #4B5C61; text-align: right; flex: none; }
.doc h3 { font-size: 15px; margin: 24px 0 10px; color: #0B4F4A; }
.doc .table-wrap { overflow: visible; }
.doc table.t { width: 100%; table-layout: auto; }
.doc table.t th { background: #F2F5F4; color: #4B5C61; white-space: normal; }
.doc table.t td, .doc table.t th { border-color: #D5DEDB; padding: 6px 8px; font-size: 12px; color: #14232A; white-space: normal; overflow-wrap: anywhere; word-break: normal; }
.doc table.t td.nowrap, .doc table.t .nowrap, .doc .t td a { white-space: normal; }
.doc table.t.compacta td, .doc table.t.compacta th { font-size: 10.5px; padding: 5px 6px; }
.doc .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.doc .kpi { box-shadow: none; background: #F8FAF9; border-color: #D5DEDB; color: #14232A; }
.doc .kpi .v { white-space: normal; }
.doc .foot { margin-top: 28px; padding-top: 10px; border-top: 1px solid #D5DEDB; font-size: 11.5px; color: #4B5C61; display: flex; justify-content: space-between; gap: 20px; }
.doc .grid.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.doc.pdf { border: 0; box-shadow: none; border-radius: 0; padding: 0; width: 100%; }
.doc table.t.ajustada { table-layout: fixed; }
.doc table.t.ajustada td, .doc table.t.ajustada th { vertical-align: top; overflow-wrap: break-word; word-break: normal; hyphens: manual; }
.doc table.t.ajustada td.curta, .doc table.t.ajustada th.curta { white-space: nowrap; }
.doc table.t.ajustada td.right, .doc table.t.ajustada th.right { text-align: right; }
.doc.pdf table.t th { line-height: 1.25; }
.doc.pdf table.t td { line-height: 1.35; }
.doc.pdf .sub { font-size: 10px; }
.doc.pdf .tag { white-space: normal; font-size: 10.5px; padding: 1px 6px; }
.doc.pdf .grid.g2 { grid-template-columns: 1fr; }
.doc.pdf .chart { max-width: 640px; margin: 0 auto; }
#print-area { display: none; }

/* ---------------- Gaveta e modal ---------------- */
.scrim { position: fixed; inset: 0; background: rgba(8, 20, 19, .45); z-index: 40; opacity: 0; transition: opacity .18s; }
.scrim.on { opacity: 1; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(660px, 100%); background: var(--surface); z-index: 41; box-shadow: -10px 0 40px rgba(0, 0, 0, .25); display: flex; flex-direction: column; transform: translateX(100%); transition: transform .22s ease; }
.drawer.on { transform: none; }
.drawer-h { padding: 18px 22px 14px; border-bottom: 1px solid var(--line); }
.drawer-h .row1 { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
.drawer-h h2 { font-size: 19px; margin-top: 4px; }
.drawer-b { padding: 18px 22px 30px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 22px; }
.drawer-f { padding: 12px 22px; border-top: 1px solid var(--line); display: flex; gap: 8px; flex-wrap: wrap; background: var(--surface-2); }
.sec-t { font-size: 14px; font-weight: 700; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
dl.kv { display: grid; grid-template-columns: 190px 1fr; gap: 7px 14px; margin: 0; font-size: 14px; }
dl.kv dt { color: var(--muted); font-size: 13px; }
dl.kv dd { margin: 0; font-weight: 500; overflow-wrap: anywhere; }

/* Etapas com marcação */
.etapas { border: 1px solid var(--line); border-radius: var(--r-md); overflow: hidden; }
.etapa { display: grid; grid-template-columns: 28px 1fr auto; gap: 12px; align-items: start; padding: 12px 14px; border-bottom: 1px solid var(--line); background: var(--surface); }
.etapa:last-child { border-bottom: 0; }
.etapa.feita { background: rgba(15, 118, 110, .07); }
.etapa input[type=checkbox] { width: 20px; height: 20px; margin: 1px 0 0; accent-color: var(--accent); cursor: pointer; }
.etapa input[disabled] { cursor: not-allowed; }
.etapa .nm { font-weight: 700; font-size: 14.5px; }
.etapa .nm small { font-weight: 500; color: var(--muted); margin-left: 6px; font-size: 12px; }
.etapa .info { font-size: 13px; color: var(--muted); margin-top: 2px; }
.etapa .info b { color: var(--ink-2); font-weight: 600; }

.modal { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 20px; }
.modal .scrim { z-index: 0; opacity: 1; position: fixed; }
.modal .box { position: relative; z-index: 1; background: var(--surface); border-radius: var(--r-lg); width: min(880px, 100%); max-height: calc(100vh - 40px); display: flex; flex-direction: column; box-shadow: 0 30px 80px rgba(0, 0, 0, .35); }
.modal .box.sm { width: min(500px, 100%); }
.modal .box.md { width: min(680px, 100%); }
.modal-h { padding: 18px 22px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.modal-h h2 { font-size: 18px; }
.modal-b { padding: 18px 22px; overflow-y: auto; }
.modal-f { padding: 12px 22px; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
fieldset.fs { border: 0; padding: 0; margin: 0 0 22px; }
fieldset.fs legend { font-weight: 700; font-size: 15px; padding: 0 0 8px; margin-bottom: 10px; border-bottom: 1px solid var(--line); width: 100%; }
.fgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 14px; }
.fgrid.c3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.fgrid .full { grid-column: 1 / -1; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; max-height: 190px; overflow-y: auto; padding: 4px 2px; margin-top: 6px; }
.f > span:first-child { font-size: 13px; font-weight: 600; color: var(--ink-2); }
.chips label { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border: 1px solid var(--line-2); border-radius: 999px; font-size: 13px; cursor: pointer; font-weight: 500; color: var(--ink); }
.chips input { accent-color: var(--brand); }
.chips label:has(input:checked) { background: color-mix(in srgb, var(--brand) 12%, var(--surface)); border-color: var(--brand); }
.err { color: var(--bad); font-size: 13.5px; font-weight: 600; }
.err:empty { display: none; }
.in[aria-invalid="true"] { border-color: var(--bad); box-shadow: 0 0 0 1px var(--bad); }
.in[readonly] { background: var(--surface-2); }
.calc { font-size: 13px; color: var(--muted); }
.calc b { color: var(--ink); }
.perm-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 16px; }

/* Login */
.login { min-height: 100vh; display: grid; place-items: center; padding: 24px; background: var(--brand-deep); }
.login .card { width: min(420px, 100%); background: var(--surface); border-radius: 16px; padding: 30px; box-shadow: 0 30px 80px rgba(0,0,0,.35); display: flex; flex-direction: column; gap: 14px; }
.login h1 { font-size: 22px; }
.login .org { color: var(--muted); font-size: 13.5px; margin-top: -8px; }
.login .modo { font-size: 12.5px; padding: 8px 10px; border-radius: 8px; background: var(--surface-2); color: var(--ink-2); }

/* Usuário e conexão na barra lateral */
.user-box { margin-top: auto; padding: 14px 8px 0; border-top: 1px solid rgba(255,255,255,.1); font-size: 12.5px; color: #9CCFC7; display: flex; flex-direction: column; gap: 6px; }
.user-box b { color: #fff; font-size: 13.5px; }
.user-box .acts { display: flex; gap: 6px; flex-wrap: wrap; }
.user-box button { background: rgba(255,255,255,.08); color: #E6F4F1; border: 0; border-radius: 6px; padding: 5px 9px; font-size: 12.5px; cursor: pointer; }
.user-box button:hover { background: rgba(255,255,255,.16); }
.conn { display: inline-flex; align-items: center; gap: 6px; }
.conn i { width: 8px; height: 8px; border-radius: 50%; background: #FBBF24; }
.conn.on i { background: #4ADE80; }
.loading { position: fixed; top: 0; left: 0; right: 0; height: 3px; z-index: 70; background: linear-gradient(90deg, transparent, var(--focus), transparent); background-size: 200% 100%; animation: ld 1s linear infinite; }
@keyframes ld { from { background-position: 200% 0; } to { background-position: -200% 0; } }

/* Gantt */
.gantt { display: grid; grid-template-columns: 300px 1fr; border-top: 1px solid var(--line); }
.g-left { border-right: 1px solid var(--line); background: var(--surface); position: relative; z-index: 2; }
.g-right { overflow-x: auto; position: relative; }
.g-canvas { position: relative; }
.g-head { height: 46px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--surface); z-index: 3; }
.g-left .g-head { display: flex; align-items: flex-end; padding: 0 14px 8px; font-size: 12.5px; color: var(--muted); font-weight: 700; }
.g-mon { position: absolute; top: 0; height: 26px; font-size: 12px; font-weight: 700; color: var(--ink-2); padding: 5px 6px; border-left: 1px solid var(--line); white-space: nowrap; overflow: hidden; }
.g-tick { position: absolute; top: 26px; height: 20px; font-size: 11px; color: var(--muted); padding: 2px 4px; border-left: 1px solid var(--line); white-space: nowrap; }
.g-row { height: 46px; border-bottom: 1px solid var(--line); position: relative; }
.g-left .g-row { display: flex; flex-direction: column; justify-content: center; padding: 0 14px; cursor: pointer; }
.g-left .g-row:hover { background: var(--surface-2); }
.g-left .g-row .a { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.g-left .g-row .b { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.g-group { height: 34px; background: var(--surface-2); border-bottom: 1px solid var(--line); font-size: 12.5px; font-weight: 700; display: flex; align-items: center; padding: 0 14px; color: var(--ink-2); }
.g-grid { position: absolute; top: 0; bottom: 0; border-left: 1px solid var(--line); opacity: .7; }
.g-today { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--bad); z-index: 4; pointer-events: none; }
.g-today span { position: absolute; top: 28px; left: 4px; font-size: 11px; font-weight: 700; color: var(--bad); background: var(--surface); padding: 0 4px; border-radius: 4px; white-space: nowrap; }
.g-plan { position: absolute; top: 9px; height: 10px; border: 1.5px dashed var(--ink-2); border-radius: 4px; opacity: .55; }
.g-real { position: absolute; top: 23px; height: 14px; border-radius: 4px; cursor: pointer; box-shadow: 0 1px 2px rgba(0,0,0,.15); }
.g-legend { display: flex; flex-wrap: wrap; gap: 14px; padding: 12px 18px; font-size: 12.5px; color: var(--muted); align-items: center; }
.g-legend span { display: inline-flex; align-items: center; gap: 6px; }
.g-legend i { width: 14px; height: 10px; border-radius: 3px; display: inline-block; }
.heat td.h { text-align: center; font-weight: 700; font-size: 12.5px; min-width: 44px; }
.heat th.v { writing-mode: vertical-rl; transform: rotate(180deg); height: 160px; vertical-align: bottom; padding: 8px 6px; white-space: nowrap; }

#toasts { position: fixed; bottom: 18px; right: 18px; display: flex; flex-direction: column; gap: 8px; z-index: 80; }
.toast { background: var(--ink); color: var(--surface); padding: 11px 16px; border-radius: var(--r-md); font-size: 14px; font-weight: 500; box-shadow: var(--shadow); max-width: 420px; transition: opacity .4s, transform .4s; }
.toast.ok { background: var(--ok); color: #fff; } .toast.erro { background: var(--bad); color: #fff; }
.toast.out { opacity: 0; transform: translateY(8px); }
.notice { padding: 10px 14px; border-radius: var(--r-md); background: var(--warn-bg); color: var(--warn); font-size: 13.5px; font-weight: 500; }
.notice.info { background: var(--info-bg); color: var(--info); }
code { font-size: 12.5px; background: var(--surface-2); padding: 1px 5px; border-radius: 4px; }

/* ---------------- Responsivo ---------------- */
@media (max-width: 1180px) { .g-main, .g3 { grid-template-columns: 1fr; } }
@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; }
  .side { position: fixed; left: 0; top: 0; z-index: 45; width: 280px; transform: translateX(-100%); transition: transform .2s; }
  .side.open { transform: none; }
  .btn.menu-btn { display: inline-flex; }
  .top { padding: 10px 16px; }
  .search input { width: 160px; }
  .view { padding: 18px 16px 40px; }
  .g2, .perm-grid { grid-template-columns: 1fr; }
  .gantt { grid-template-columns: 170px 1fr; }
  .fgrid, .fgrid.c3 { grid-template-columns: 1fr; }
  dl.kv { grid-template-columns: 1fr; gap: 2px; }
  dl.kv dd { margin-bottom: 8px; }
  .top .sub { display: none; }
  .periodo .resumo { text-align: left; }
}
@media (max-width: 600px) {
  .search { display: none; }
  .doc { padding: 20px; }
  .top h1 { font-size: 18px; }
  .li { grid-template-columns: auto 1fr; }
  .li > .tag { grid-column: 2; justify-self: start; }
  #btn-nova span { display: none; }
}

/* ---------------- Impressão ---------------- */
@media print {
  @page { size: A4; margin: 12mm; }
  html, body { background: #fff !important; font-size: 12px; overflow: visible !important; }
  .side, .top, .no-print, .tabs, #toasts, .periodo, #drawer, #d-scrim, .modal, .loading { display: none !important; }
  .app { display: block; }
  .view { padding: 0; max-width: none; }
  body.print-doc > *:not(#print-area) { display: none !important; }
  body.print-doc #print-area { display: block; }
  .doc { border: 0; box-shadow: none; padding: 0; border-radius: 0; }
  .doc .grid.g2 { grid-template-columns: 1fr; }
  .doc h3 { break-after: avoid; }
  .doc tr { break-inside: avoid; }
  .doc thead { display: table-header-group; }
  .doc table.t td, .doc table.t th { font-size: 10.5px; padding: 4px 6px; }
  .doc table.t.compacta td, .doc table.t.compacta th { font-size: 9px; padding: 3px 4px; }
  .chart, .avoid-break, .kpi, .meter { break-inside: avoid; }
}

/* ---------------- Painel somente leitura (Looker Studio) ---------------- */
.pub { min-height: 100vh; background: var(--bg); }
.pub-h { display: flex; justify-content: space-between; align-items: center; gap: 12px 24px; flex-wrap: wrap; padding: 14px 28px; background: var(--brand-deep); color: #E6F4F1; }
.pub-t { font-size: 18px; font-weight: 800; color: #fff; }
.pub-o { font-size: 13px; color: #9CCFC7; margin-top: 2px; }
.pub-m { display: flex; gap: 16px; align-items: center; font-size: 13px; color: #CFE6E1; flex-wrap: wrap; }
.pub-m b { color: #fff; }
.modo-painel .view { max-width: none; }
ol.passos { margin: 12px 0 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; font-size: 14px; }

/* =========================================================================
   CENTRAL DE ATENDIMENTO (HELP DESK)
   ========================================================================= */
.tag.hd-tag { background: #EDE9FE; color: #5B21B6; font-size: 11px; padding: 1px 7px; vertical-align: middle; }
.link-hd { font-size: 13.5px; font-weight: 600; text-align: center; }
.modo-hd { background: #F3F6F8; }
.hd { min-height: 100vh; display: flex; flex-direction: column; color: #14232A; }
.hd-top { display: flex; justify-content: space-between; align-items: center; gap: 12px 20px; flex-wrap: wrap; padding: 14px clamp(16px, 4vw, 48px); background: #083B37; color: #E6F4F1; }
.hd-marca { display: flex; align-items: center; gap: 12px; }
.hd-logo { width: 42px; height: 42px; border-radius: 12px; background: linear-gradient(135deg, #14B8A6, #0E7490); display: grid; place-items: center; color: #fff; flex: none; }
.hd-logo svg { width: 24px; height: 24px; }
.hd-nome { font-size: 18px; font-weight: 800; color: #fff; letter-spacing: -0.01em; }
.hd-sub { font-size: 12.5px; color: #9CCFC7; }
.hd-acoes { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.hd-acoes button, .hd-equipe { border: 1px solid rgba(255,255,255,.25); background: transparent; color: #E6F4F1; border-radius: 999px; padding: 7px 14px; font-size: 13px; font-weight: 600; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 7px; }
.hd-acoes button:hover, .hd-equipe:hover { background: rgba(255,255,255,.1); }
.hd-priv svg { width: 15px; height: 15px; }
.hd-priv[aria-pressed="true"] { background: #FDE68A; color: #713F12; border-color: #FDE68A; }
.hd-hero { background: linear-gradient(160deg, #0B4F4A 0%, #0E7490 70%, #1D4ED8 130%); color: #fff; padding: 36px clamp(16px, 4vw, 48px) 64px; }
.hd-hero-in { max-width: 1180px; margin: 0 auto; }
.hd-hero h1 { font-size: clamp(26px, 3.2vw, 36px); font-weight: 800; letter-spacing: -0.02em; }
.hd-hero p { max-width: 720px; margin-top: 8px; color: #D7F0EC; font-size: 15.5px; }
.hd-cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; margin-top: 24px; }
.hd-card { text-align: left; border: 0; border-radius: 16px; padding: 18px; background: #fff; color: #14232A; cursor: pointer; display: grid; grid-template-columns: auto 1fr; grid-template-rows: auto auto; column-gap: 14px; box-shadow: 0 12px 30px -16px rgba(0,0,0,.45); transition: transform .15s; }
.hd-card:hover { transform: translateY(-2px); }
.hd-card .ic { grid-row: span 2; width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: var(--c); color: #fff; }
.hd-card .ic svg { width: 22px; height: 22px; }
.hd-card b { font-size: 16px; } .hd-card span:last-child { font-size: 13px; color: #5E7075; }
.hd-abas { max-width: 1180px; width: calc(100% - 2 * clamp(16px, 4vw, 48px)); margin: -26px auto 0; background: #fff; border-radius: 14px; box-shadow: 0 10px 30px -18px rgba(0,0,0,.35); display: flex; padding: 6px; gap: 6px; position: relative; z-index: 2; }
.hd-abas button { flex: 1; border: 0; background: transparent; padding: 12px; border-radius: 10px; font-weight: 700; font-size: 15px; color: #5E7075; cursor: pointer; }
.hd-abas button[aria-selected="true"] { background: #0B4F4A; color: #fff; }
.hd-main { max-width: 1180px; width: calc(100% - 2 * clamp(16px, 4vw, 48px)); margin: 22px auto 40px; flex: 1; }
.hd-grid { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 20px; align-items: start; }
.hd-lado { position: sticky; top: 16px; display: flex; flex-direction: column; gap: 14px; }
.hd-box { background: #fff; border: 1px solid #DDE5E3; border-radius: 14px; padding: 16px 18px; font-size: 13.5px; }
.hd-box > b { display: block; font-size: 14.5px; margin-bottom: 8px; }
.hd-box p { color: #4B5C61; }
.hd-passos { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; counter-reset: p; }
.hd-passos li { display: flex; align-items: center; gap: 10px; counter-increment: p; }
.hd-passos li::before { content: counter(p); width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; background: #EEF2F1; color: #5E7075; flex: none; }
.hd-passos li.feita::before { content: "✓"; background: var(--c); color: #fff; }

  /* Listas de apoio: inserção manual e importação de Excel */
  function salvarSetores(lista, msg) {
    var unicos = [];
    lista.forEach(function (x) { x = String(x || '').trim().toUpperCase(); if (x && unicos.indexOf(x) < 0) unicos.push(x); });
    unicos.sort(function (a, b) { return a.localeCompare(b, 'pt-BR'); });
    return Api.chamar('salvarConfig', { config: { setores: unicos } }).then(function (r) { U.toast(r.semAlteracao ? 'A lista já estava atualizada.' : msg + ' A lista tem ' + unicos.length + ' setores e unidades.', 'ok'); return true; });
  }
  function inserirSetor() {
    UI.modal({
      title: 'Inserir setor ou unidade', size: 'sm', ok: 'Inserir',
      body: '<label class="f"><span class="req">Sigla</span><input class="in" id="nova-sigla" autocomplete="off" placeholder="Ex.: SUBAD"><span class="calc">Para inserir várias de uma vez, separe por vírgula.</span></label>',
      onOk: function (w) {
        var novas = w.querySelector('#nova-sigla').value.split(/[,;\n]/).map(function (x) { return x.trim().toUpperCase(); }).filter(Boolean);
        if (!novas.length) { w.erro('Informe a sigla.'); return false; }
        var atuais = App.D.config.setores, ja = novas.filter(function (x) { return atuais.indexOf(x) >= 0; });
        if (ja.length === novas.length) { w.erro('Já está na lista: ' + ja.join(', ') + '.'); return false; }
        return salvarSetores(atuais.concat(novas), (novas.length - ja.length) + ' inserido(s).');
      }
    });
  }
  function importarSetores(arquivo) {
    U.toast('Lendo a planilha…');
    U.lerPlanilha(arquivo).then(function (linhas) {
      linhas = linhas.filter(function (l) { return l.some(function (c) { return String(c).trim(); }); });
      if (!linhas.length) throw new Error('A planilha está vazia.');
      var col = 0, ini = 0;
      for (var r = 0; r < Math.min(5, linhas.length) && !ini; r++) {
        var ix = linhas[r].map(function (c) { return U.norm(c).trim(); }).findIndex(function (c) { return c === 'sigla' || c === 'siglas' || c === 'setor' || c === 'setores' || c === 'unidade'; });
        if (ix >= 0) { col = ix; ini = r + 1; }
      }
      var siglas = [];
      linhas.slice(ini).forEach(function (l) { var v = String(l[col] || '').trim().toUpperCase(); if (v && siglas.indexOf(v) < 0) siglas.push(v); });
      if (!siglas.length) throw new Error('Nenhuma sigla encontrada na planilha.');
      var atuais = App.D.config.setores, novas = siglas.filter(function (x) { return atuais.indexOf(x) < 0; }), sairiam = atuais.filter(function (x) { return siglas.indexOf(x) < 0; });
      UI.modal({
        title: 'Importar setores e unidades', size: 'md', ok: 'Atualizar lista',
        body: '<p><b>' + siglas.length + '</b> sigla(s) encontrada(s) em "' + e(arquivo.name) + '": <b>' + novas.length + '</b> nova(s) e ' + (siglas.length - novas.length) + ' já cadastrada(s).</p>' +

        onOk: function (w) {
          var modo = w.querySelector('[name=modo]:checked').value;
          return salvarSetores(modo === 'substituir' ? siglas : atuais.concat(novas), 'Lista importada.');
        }
      });
    }).catch(function (err) { U.toast(err && err.message ? err.message : 'Não foi possível importar a planilha.', 'erro'); });
  }
