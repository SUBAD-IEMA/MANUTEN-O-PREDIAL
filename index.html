/* =========================================================================
   Gestão de Manutenção Predial — IEMA
   Identidade: verde institucional + as sete cores das etapas da IS
   ========================================================================= */
:root {
  --brand: #0B4F4A;
  --brand-deep: #083B37;
  --brand-ink: #E6F4F1;
  --accent: #0F766E;
  --bg: #F2F5F4;
  --surface: #FFFFFF;
  --surface-2: #EBF0EE;
  --surface-3: #E1E8E6;
  --ink: #14232A;
  --ink-2: #33464C;
  --muted: #5E7075;
  --line: #D5DEDB;
  --line-2: #C3CFCB;
  --focus: #0EA5A0;

  --e1: #1D4ED8; --e2: #6D28D9; --e3: #0F766E; --e4: #BE123C; --e5: #475569; --e6: #15803D; --e7: #C2410C; --e8: #0B4F4A;

  --ok: #15803D; --ok-bg: #DCFCE7;
  --warn: #A16207; --warn-bg: #FEF3C7;
  --bad: #B91C1C; --bad-bg: #FEE2E2;
  --info: #1D4ED8; --info-bg: #DBEAFE;
  --neutral-bg: #E2E8F0;

  --r-lg: 14px; --r-md: 9px; --r-sm: 6px;
  --shadow: 0 1px 2px rgba(20, 35, 42, .06), 0 6px 18px -10px rgba(20, 35, 42, .18);
  --font: "Public Sans", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --side: 248px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C1514; --surface: #13201E; --surface-2: #1A2a27; --surface-3: #223532;
    --ink: #E4EEEC; --ink-2: #C3D2CF; --muted: #8FA3A0; --line: #263835; --line-2: #33504b; --focus: #2DD4BF;
    --ok-bg: #12301f; --warn-bg: #33270b; --bad-bg: #3a1515; --info-bg: #14234a; --neutral-bg: #233130;
    --ok: #4ADE80; --warn: #FBBF24; --bad: #F87171; --info: #93C5FD;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 20px -12px rgba(0, 0, 0, .6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C1514; --surface: #13201E; --surface-2: #1A2a27; --surface-3: #223532;
  --ink: #E4EEEC; --ink-2: #C3D2CF; --muted: #8FA3A0; --line: #263835; --line-2: #33504b; --focus: #2DD4BF;
  --ok-bg: #12301f; --warn-bg: #33270b; --bad-bg: #3a1515; --info-bg: #14234a; --neutral-bg: #233130;
  --ok: #4ADE80; --warn: #FBBF24; --bad: #F87171; --info: #93C5FD;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 20px -12px rgba(0, 0, 0, .6);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font-family: var(--font); font-size: 15px; line-height: 1.5; color: var(--ink); background: var(--bg);
  -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums;
}
h1, h2, h3, h4 { margin: 0; line-height: 1.2; font-weight: 700; letter-spacing: -0.01em; }
p { margin: 0; }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* ---------------- Estrutura ---------------- */
.app { display: grid; grid-template-columns: var(--side) 1fr; min-height: 100vh; }
.side {
  background: var(--brand-deep); color: var(--brand-ink); position: sticky; top: 0; height: 100vh;
  display: flex; flex-direction: column; padding: 22px 14px 16px; overflow-y: auto;
}
.brand { padding: 0 8px 18px; border-bottom: 1px solid rgba(255, 255, 255, .1); margin-bottom: 14px; }
.brand-name { font-size: 17px; font-weight: 800; color: #fff; line-height: 1.15; }
.brand-org { font-size: 12.5px; color: #9CCFC7; margin-top: 4px; }
.brand-track { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; margin-top: 14px; }
.brand-track i { height: 5px; border-radius: 3px; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav a {
  display: flex; align-items: center; gap: 11px; padding: 9px 10px; border-radius: var(--r-md);
  color: #CFE6E1; text-decoration: none; font-weight: 500; font-size: 14.5px;
}
.nav a svg { width: 18px; height: 18px; flex: none; opacity: .85; }
.nav a:hover { background: rgba(255, 255, 255, .07); color: #fff; }
.nav a[aria-current="page"] { background: #fff; color: var(--brand-deep); font-weight: 700; }
.nav a[aria-current="page"] svg { opacity: 1; }
.nav .sep { height: 1px; background: rgba(255, 255, 255, .1); margin: 10px 6px; }
.nav .gestor { color: #FDE68A; }
.nav .gestor[aria-current="page"] { color: var(--brand-deep); }
.side-foot { margin-top: auto; padding: 14px 8px 0; font-size: 12px; color: #8CBDB5; }
.side-foot b { color: #CFE6E1; font-weight: 600; }

.main { min-width: 0; display: flex; flex-direction: column; }
.top {
  position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(8px); border-bottom: 1px solid var(--line);
  display: flex; align-items: center; gap: 12px; padding: 12px 28px;
}
.top h1 { font-size: 21px; }
.top .sub { color: var(--muted); font-size: 13.5px; }
.top-spacer { flex: 1; }
.search { position: relative; }
.search input {
  width: 260px; padding: 8px 12px 8px 34px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--surface);
}
.search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--muted); }
.btn.menu-btn { display: none; }
.view { padding: 24px 28px 48px; max-width: 1480px; width: 100%; }

/* ---------------- Botões e campos ---------------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 8px 14px; border-radius: var(--r-md);
  border: 1px solid var(--line-2); background: var(--surface); color: var(--ink); font-weight: 600; font-size: 14px;
  cursor: pointer; white-space: nowrap; text-decoration: none; line-height: 1.2;
}
.btn:hover { background: var(--surface-2); }
.btn svg { width: 16px; height: 16px; }
.btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
.btn.primary:hover { background: var(--brand-deep); }
.btn.danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, var(--line)); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--surface-2); }
.btn.sm { padding: 5px 10px; font-size: 13px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.icon-btn { width: 36px; height: 36px; padding: 0; border-radius: 999px; }

label.f { display: flex; flex-direction: column; gap: 5px; font-size: 13px; font-weight: 600; color: var(--ink-2); }
label.f .hint { font-weight: 400; color: var(--muted); font-size: 12px; }
.in, select.in, textarea.in {
  width: 100%; padding: 8px 10px; border-radius: var(--r-sm); border: 1px solid var(--line-2); background: var(--surface);
  font-weight: 400; font-size: 14px;
}
textarea.in { min-height: 84px; resize: vertical; }
.in:focus { outline: 2px solid var(--focus); outline-offset: 0; border-color: transparent; }
.in[aria-invalid="true"] { border-color: var(--bad); box-shadow: 0 0 0 1px var(--bad); }
.req::after { content: " *"; color: var(--bad); }
.check { display: flex; align-items: flex-start; gap: 9px; font-size: 14px; cursor: pointer; }
.check input { margin-top: 3px; width: 16px; height: 16px; accent-color: var(--brand); }

/* ---------------- Blocos ---------------- */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow); }
.panel-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 16px 18px 0; }
.panel-h h2 { font-size: 16px; }
.panel-h .meta { color: var(--muted); font-size: 13px; }
.panel-b { padding: 14px 18px 18px; }
.grid { display: grid; gap: 18px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g-main { grid-template-columns: minmax(0, 1.65fr) minmax(0, 1fr); }
.stack { display: flex; flex-direction: column; gap: 18px; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.right { text-align: right; }
.nowrap { white-space: nowrap; }
.empty { padding: 28px; text-align: center; color: var(--muted); }
.empty b { display: block; color: var(--ink); font-size: 15px; margin-bottom: 4px; }

/* Faixa de etapas (painel inicial) */
.pipeline { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 0; border-radius: var(--r-lg); overflow: hidden; border: 1px solid var(--line); background: var(--surface); box-shadow: var(--shadow); }
.pipe {
  position: relative; padding: 16px 14px 14px; border-right: 1px solid var(--line); text-decoration: none; color: inherit;
  display: flex; flex-direction: column; gap: 2px; min-width: 0;
}
.pipe:last-child { border-right: 0; }
.pipe::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 5px; background: var(--c); }
.pipe:hover { background: var(--surface-2); }
.pipe .n { font-size: 12.5px; font-weight: 700; color: var(--c); }
.pipe .t { font-size: 14px; font-weight: 600; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pipe .q { font-size: 34px; font-weight: 800; line-height: 1.1; margin-top: 6px; letter-spacing: -0.02em; }
.pipe .v { font-size: 12.5px; color: var(--muted); }
.pipe .late { font-size: 12px; font-weight: 600; color: var(--bad); min-height: 18px; }

/* KPIs */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 14px 16px; box-shadow: var(--shadow); border-left: 4px solid var(--c, var(--brand)); }
.kpi .l { font-size: 13px; color: var(--muted); font-weight: 600; }
.kpi .v { white-space: nowrap; font-size: clamp(20px, 1.9vw, 26px); font-weight: 800; letter-spacing: -0.02em; margin-top: 2px; }
.kpi .s { font-size: 12.5px; color: var(--muted); }

/* Trilha de etapas por demanda */
.track { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; width: 112px; }
.track i { height: 7px; border-radius: 2px; background: var(--surface-3); }
.track i.on { background: var(--c); }
.track i.cur { background: var(--c); box-shadow: 0 0 0 2px color-mix(in srgb, var(--c) 35%, transparent); }
.track.lg { width: 100%; gap: 4px; }
.track.lg i { height: 10px; border-radius: 3px; }
.track.dim i.on, .track.dim i.cur { opacity: .45; }
.stage-label { font-size: 13px; font-weight: 600; color: var(--c); white-space: nowrap; }
.t td a { white-space: nowrap; }

/* Selos */
.tag { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px; font-size: 12.5px; font-weight: 600; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.tag .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.tag.ok { background: var(--ok-bg); color: var(--ok); }
.tag.atencao { background: var(--warn-bg); color: var(--warn); }
.tag.atrasada { background: var(--bad-bg); color: var(--bad); }
.tag.concluida { background: color-mix(in srgb, var(--brand) 14%, var(--surface)); color: var(--e8); }
:root[data-theme="dark"] .tag.concluida { color: #5EEAD4; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .tag.concluida { color: #5EEAD4; } }
.tag.suspensa, .tag.neutro { background: var(--neutral-bg); color: var(--muted); }
.tag.mod-p { background: color-mix(in srgb, var(--e4) 13%, var(--surface)); color: var(--e4); }
.tag.mod-c { background: color-mix(in srgb, var(--e1) 13%, var(--surface)); color: var(--e1); }
:root[data-theme="dark"] .tag.mod-p { color: #FDA4AF; } :root[data-theme="dark"] .tag.mod-c { color: #93C5FD; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .tag.mod-p { color: #FDA4AF; } :root:not([data-theme="light"]) .tag.mod-c { color: #93C5FD; } }

/* ---------------- Tabelas ---------------- */
.table-wrap { overflow-x: auto; }
table.t { width: 100%; border-collapse: collapse; font-size: 14px; }
.t th { text-align: left; font-size: 12.5px; color: var(--muted); font-weight: 700; padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--surface); position: sticky; top: 0; }
.t th button { all: unset; cursor: pointer; display: inline-flex; gap: 4px; align-items: center; }
.t th button:focus-visible { outline: 2px solid var(--focus); }
.t th.right, .t td.right { text-align: right; }
.t td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.t tbody tr { cursor: pointer; }
.t tbody tr:hover td { background: var(--surface-2); }
.t tr.static { cursor: default; }
.t .id { font-weight: 700; font-size: 13px; color: var(--ink-2); white-space: nowrap; }
.t .tt { font-weight: 600; max-width: 380px; }
.t .sub { font-size: 12.5px; color: var(--muted); }
.t tfoot td { font-weight: 700; border-bottom: 0; }

.filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.filters label.f { min-width: 150px; flex: 1 1 150px; max-width: 220px; }
.filters .grow { flex: 2 1 240px; max-width: none; }
.count { font-size: 13px; color: var(--muted); padding: 10px 18px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

/* Segmentado */
.seg { display: inline-flex; background: var(--surface-2); border-radius: var(--r-md); padding: 3px; gap: 2px; border: 1px solid var(--line); }
.seg button { border: 0; background: transparent; padding: 6px 12px; border-radius: 7px; font-weight: 600; font-size: 13.5px; cursor: pointer; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }

/* ---------------- Kanban de etapas ---------------- */
.board { display: grid; grid-template-columns: repeat(7, minmax(232px, 1fr)); gap: 12px; overflow-x: auto; padding-bottom: 8px; align-items: start; }
.col { background: var(--surface-2); border-radius: var(--r-lg); border: 1px solid var(--line); display: flex; flex-direction: column; min-height: 240px; }
.col-h { padding: 12px 12px 10px; border-top: 5px solid var(--c); border-radius: var(--r-lg) var(--r-lg) 0 0; background: var(--surface); border-bottom: 1px solid var(--line); }
.col-h .n { font-size: 12px; font-weight: 700; color: var(--c); }
.col-h h3 { font-size: 14.5px; margin-top: 1px; }
.col-h .r { font-size: 12px; color: var(--muted); }
.col-h .agg { display: flex; justify-content: space-between; font-size: 12.5px; margin-top: 6px; font-weight: 600; }
.col-b { padding: 10px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
.col.drop { outline: 2px dashed var(--c); outline-offset: -4px; }
.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 10px 11px; cursor: grab;
  border-left: 4px solid var(--crit, var(--line)); display: flex; flex-direction: column; gap: 5px;
}
.card:hover { border-color: var(--line-2); }
.card.dragging { opacity: .5; }
.card .h { display: flex; justify-content: space-between; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: var(--muted); }
.card .h > span:first-child { white-space: nowrap; }
.card .tt { font-size: 13.5px; font-weight: 600; line-height: 1.3; }
.card .loc { font-size: 12px; color: var(--muted); }
.sla { height: 5px; border-radius: 3px; background: var(--surface-3); overflow: hidden; }
.sla i { display: block; height: 100%; background: var(--ok); }
.sla.w i { background: #D97706; } .sla.b i { background: var(--bad); }
.card .ft { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--muted); }

/* ---------------- Cronograma (Gantt) ---------------- */
.gantt { display: grid; grid-template-columns: 300px 1fr; border-top: 1px solid var(--line); }
.g-left { border-right: 1px solid var(--line); background: var(--surface); position: relative; z-index: 2; }
.g-right { overflow-x: auto; position: relative; }
.g-canvas { position: relative; }
.g-head { height: 46px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--surface); z-index: 3; }
.g-left .g-head { display: flex; align-items: flex-end; padding: 0 14px 8px; font-size: 12.5px; color: var(--muted); font-weight: 700; }
.g-mon { position: absolute; top: 0; height: 26px; font-size: 12px; font-weight: 700; color: var(--ink-2); padding: 5px 6px; border-left: 1px solid var(--line); white-space: nowrap; overflow: hidden; }
.g-tick { position: absolute; top: 26px; height: 20px; font-size: 11px; color: var(--muted); padding: 2px 4px; border-left: 1px solid var(--line); white-space: nowrap; }
.g-row { height: 46px; border-bottom: 1px solid var(--line); position: relative; }
.g-left .g-row { display: flex; flex-direction: column; justify-content: center; padding: 0 14px; cursor: pointer; }
.g-left .g-row:hover { background: var(--surface-2); }
.g-left .g-row .a { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.g-left .g-row .b { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.g-group { height: 34px; background: var(--surface-2); border-bottom: 1px solid var(--line); font-size: 12.5px; font-weight: 700; display: flex; align-items: center; padding: 0 14px; color: var(--ink-2); }
.g-right .g-group { padding: 0; }
.g-grid { position: absolute; top: 0; bottom: 0; border-left: 1px solid var(--line); opacity: .7; }
.g-week { position: absolute; top: 46px; bottom: 0; background: var(--surface-2); opacity: .45; }
.g-today { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--bad); z-index: 4; pointer-events: none; }
.g-today span { position: absolute; top: 28px; left: 4px; font-size: 11px; font-weight: 700; color: var(--bad); background: var(--surface); padding: 0 4px; border-radius: 4px; white-space: nowrap; }
.g-plan { position: absolute; top: 8px; height: 10px; border: 1.5px dashed var(--ink-2); border-radius: 4px; opacity: .55; }
.g-real { position: absolute; top: 22px; height: 16px; display: flex; border-radius: 4px; overflow: hidden; cursor: pointer; box-shadow: 0 1px 2px rgba(0,0,0,.15); }
.g-real i { height: 100%; min-width: 2px; }
.g-real.done::after { content: "✓"; position: absolute; right: -16px; top: -1px; font-size: 12px; font-weight: 800; color: var(--ok); }
.g-legend { display: flex; flex-wrap: wrap; gap: 14px; padding: 12px 18px; font-size: 12.5px; color: var(--muted); align-items: center; }
.g-legend span { display: inline-flex; align-items: center; gap: 6px; }
.g-legend i { width: 14px; height: 10px; border-radius: 3px; display: inline-block; }

/* ---------------- Gráficos SVG ---------------- */
.chart { width: 100%; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart text { fill: var(--muted); font-family: var(--font); font-size: 11.5px; }
.chart .lbl { fill: var(--ink-2); font-weight: 600; }
.chart .val { fill: var(--ink); font-weight: 700; }
.chart .axis { stroke: var(--line); }
.chart .grid-l { stroke: var(--line); stroke-dasharray: 2 3; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px; color: var(--ink-2); margin-top: 10px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.donut-wrap { display: grid; grid-template-columns: 150px 1fr; gap: 16px; align-items: center; }
.donut-wrap .legend { flex-direction: column; margin: 0; }
.donut-wrap .legend b { margin-left: auto; padding-left: 10px; }
.donut-wrap .legend span { width: 100%; }

/* Barras de setor / heatmap */
.bars { display: flex; flex-direction: column; gap: 9px; }
.bar-row { display: grid; grid-template-columns: minmax(90px, 38%) 1fr auto; gap: 10px; align-items: center; font-size: 13px; }
.bar-row .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink-2); font-weight: 600; }
.bar-row .bg { height: 12px; background: var(--surface-2); border-radius: 999px; overflow: hidden; display: flex; }
.bar-row .bg i { height: 100%; }
.bar-row .nv { font-weight: 700; min-width: 70px; text-align: right; }
.heat td.h { text-align: center; font-weight: 700; font-size: 12.5px; min-width: 44px; }
.heat th.v { writing-mode: vertical-rl; transform: rotate(180deg); height: 160px; white-space: nowrap; vertical-align: bottom; padding: 8px 6px; }

/* Lista de alertas e próximos prazos */
.list { display: flex; flex-direction: column; }
.li { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; padding: 10px 2px; border-bottom: 1px solid var(--line); cursor: pointer; }
.li:last-child { border-bottom: 0; }
.li:hover { background: var(--surface-2); }
.li .date { text-align: center; min-width: 46px; border-radius: 8px; padding: 4px 6px; background: var(--surface-2); }
.li .date b { display: block; font-size: 17px; line-height: 1.1; }
.li .date span { font-size: 11px; color: var(--muted); }
.li .tt { font-weight: 600; font-size: 14px; }
.li .sub { font-size: 12.5px; color: var(--muted); }
.alert { display: grid; grid-template-columns: 6px 1fr auto; gap: 12px; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--surface); align-items: center; }
.alert .bar { align-self: stretch; border-radius: 3px; background: var(--muted); }
.alert.alto .bar { background: var(--bad); } .alert.medio .bar { background: #D97706; } .alert.baixo .bar { background: var(--info); }
.alert .tt { font-weight: 700; font-size: 14px; }
.alert .sub { font-size: 13px; color: var(--muted); }

/* Gestor */
.lock { max-width: 420px; margin: 40px auto; text-align: center; }
.lock .panel-b { display: flex; flex-direction: column; gap: 14px; padding: 28px; }
.lock h2 { font-size: 20px; }
.lock input { text-align: center; font-size: 22px; letter-spacing: .4em; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 20px; overflow-x: auto; }
.tabs button { border: 0; background: transparent; padding: 10px 14px; font-weight: 600; color: var(--muted); cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -1px; white-space: nowrap; font-size: 14.5px; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--brand); }
.reports { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.rep-card { text-align: left; padding: 14px 16px; border-radius: var(--r-md); border: 1px solid var(--line); background: var(--surface); cursor: pointer; display: flex; flex-direction: column; gap: 4px; border-top: 4px solid var(--c); }
.rep-card:hover { background: var(--surface-2); }
.rep-card[aria-pressed="true"] { outline: 2px solid var(--c); }
.rep-card b { font-size: 14.5px; }
.rep-card span { font-size: 13px; color: var(--muted); }
.gauge-num { font-size: 32px; font-weight: 800; letter-spacing: -0.02em; }

/* Documento de relatório (tela e impressão) */
.doc { background: #fff; color: #14232A; border: 1px solid var(--line); border-radius: var(--r-lg); padding: 36px 40px; box-shadow: var(--shadow); }
.doc .chart text { fill: #4B5C61; } .doc .chart .lbl { fill: #33464C; } .doc .chart .val { fill: #14232A; }
.doc .chart .axis, .doc .chart .grid-l { stroke: #D5DEDB; }
.doc-h { display: flex; justify-content: space-between; gap: 20px; border-bottom: 3px solid var(--brand); padding-bottom: 14px; margin-bottom: 22px; }
.doc-h .org { font-size: 12.5px; color: #4B5C61; font-weight: 600; }
.doc-h h2 { font-size: 22px; margin-top: 4px; }
.doc-h .gen { font-size: 12.5px; color: #4B5C61; text-align: right; }
.doc h3 { font-size: 15px; margin: 22px 0 10px; color: var(--brand); }
.doc table.t th { background: #F2F5F4; color: #4B5C61; position: static; }
.doc table.t td, .doc table.t th { border-color: #D5DEDB; padding: 7px 9px; font-size: 12.5px; }
.doc table.t tbody tr { cursor: default; }
.doc table.t tbody tr:hover td { background: transparent; }
.doc .kpis .kpi { box-shadow: none; background: #F8FAF9; border-color: #D5DEDB; color: #14232A; }
.doc .kpis .kpi .l, .doc .kpis .kpi .s { color: #4B5C61; }
.doc .tag { background: #EBF0EE; color: #33464C; }
.doc .foot { margin-top: 28px; padding-top: 10px; border-top: 1px solid #D5DEDB; font-size: 11.5px; color: #4B5C61; display: flex; justify-content: space-between; }
.doc .bar-row .nm { color: #33464C; } .doc .bar-row .bg { background: #EBF0EE; }

/* ---------------- Gaveta de detalhe e modal ---------------- */
.scrim { position: fixed; inset: 0; background: rgba(8, 20, 19, .45); z-index: 40; opacity: 0; transition: opacity .18s; }
.scrim.on { opacity: 1; }
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(620px, 100%); background: var(--surface); z-index: 41;
  box-shadow: -10px 0 40px rgba(0, 0, 0, .25); display: flex; flex-direction: column; transform: translateX(100%); transition: transform .22s ease;
}
.drawer.on { transform: none; }
.drawer-h { padding: 18px 22px 14px; border-bottom: 1px solid var(--line); }
.drawer-h .row1 { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
.drawer-h h2 { font-size: 19px; margin-top: 4px; }
.drawer-b { padding: 18px 22px 30px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 18px; }
.drawer-f { padding: 12px 22px; border-top: 1px solid var(--line); display: flex; gap: 8px; flex-wrap: wrap; background: var(--surface-2); }
.stagebox { border: 1px solid var(--line); border-radius: var(--r-md); padding: 14px; background: var(--surface-2); }
.stage-dates { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 6px; font-size: 11px; color: var(--muted); text-align: center; }
.stage-dates b { display: block; color: var(--ink-2); font-size: 11px; }
.req-list { margin: 10px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 5px; font-size: 13px; }
.req-list li { display: flex; gap: 8px; align-items: flex-start; }
.req-list li::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #D97706; margin-top: 7px; flex: none; }
.req-ok { font-size: 13px; color: var(--ok); font-weight: 600; margin-top: 8px; }
dl.kv { display: grid; grid-template-columns: 170px 1fr; gap: 8px 14px; margin: 0; font-size: 14px; }
dl.kv dt { color: var(--muted); font-size: 13px; }
dl.kv dd { margin: 0; font-weight: 500; }
.sec-t { font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 8px; }
.timeline { list-style: none; margin: 0; padding: 0; position: relative; }
.timeline li { position: relative; padding: 0 0 14px 22px; font-size: 13.5px; }
.timeline li::before { content: ""; position: absolute; left: 5px; top: 6px; width: 10px; height: 10px; border-radius: 50%; background: var(--c); }
.timeline li::after { content: ""; position: absolute; left: 9.5px; top: 18px; bottom: -2px; width: 1px; background: var(--line-2); }
.timeline li:last-child::after { display: none; }
.timeline .d { color: var(--muted); font-size: 12.5px; }
.docs-grid { display: grid; gap: 8px; }
.docs-grid .check { padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface); }
.docs-grid .check small { display: block; color: var(--muted); font-size: 12px; }

.modal { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 20px; }
.modal .scrim { z-index: 0; }
.modal .box { background: var(--surface); border-radius: var(--r-lg); width: min(880px, 100%); max-height: calc(100vh - 40px); display: flex; flex-direction: column; box-shadow: 0 30px 80px rgba(0, 0, 0, .35); }
.modal .box.sm { width: min(480px, 100%); }
.modal-h { padding: 18px 22px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; }
.modal-h h2 { font-size: 18px; }
.modal-b { padding: 18px 22px; overflow-y: auto; }
.modal-f { padding: 12px 22px; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; gap: 8px; }
fieldset.fs { border: 0; padding: 0; margin: 0 0 20px; }
fieldset.fs legend { font-weight: 700; font-size: 14.5px; padding: 0; margin-bottom: 10px; display: flex; gap: 8px; align-items: center; }
fieldset.fs legend i { width: 10px; height: 10px; border-radius: 3px; background: var(--c); }
.fgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 14px; }
.fgrid .full { grid-column: 1 / -1; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips label { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border: 1px solid var(--line-2); border-radius: 999px; font-size: 13px; cursor: pointer; font-weight: 500; color: var(--ink); }
.chips input { accent-color: var(--brand); }
.chips label:has(input:checked) { background: color-mix(in srgb, var(--brand) 12%, var(--surface)); border-color: var(--brand); }
.err { color: var(--bad); font-size: 13px; font-weight: 600; }

#toasts { position: fixed; bottom: 18px; right: 18px; display: flex; flex-direction: column; gap: 8px; z-index: 60; }
.toast { background: var(--ink); color: var(--surface); padding: 11px 16px; border-radius: var(--r-md); font-size: 14px; font-weight: 500; box-shadow: var(--shadow); max-width: 380px; transition: opacity .4s, transform .4s; }
.toast.ok { background: var(--ok); color: #fff; } .toast.erro { background: var(--bad); color: #fff; }
.toast.out { opacity: 0; transform: translateY(8px); }

.notice { padding: 10px 14px; border-radius: var(--r-md); background: var(--warn-bg); color: var(--warn); font-size: 13.5px; font-weight: 500; }
.notice.info { background: var(--info-bg); color: var(--info); }

/* ---------------- Responsivo ---------------- */
@media (max-width: 1180px) {
  .g-main, .g3 { grid-template-columns: 1fr; }
  .pipeline { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .pipe { border-bottom: 1px solid var(--line); }
}
@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; }
  .side { position: fixed; left: 0; top: 0; z-index: 45; width: 270px; transform: translateX(-100%); transition: transform .2s; }
  .side.open { transform: none; }
  .btn.menu-btn { display: inline-flex; }
  .top { padding: 10px 16px; }
  .search input { width: 160px; }
  .view { padding: 18px 16px 40px; }
  .g2 { grid-template-columns: 1fr; }
  .gantt { grid-template-columns: 180px 1fr; }
  .fgrid { grid-template-columns: 1fr; }
  dl.kv { grid-template-columns: 1fr; gap: 2px; }
  dl.kv dd { margin-bottom: 8px; }
  .top .sub { display: none; }
}
@media (max-width: 600px) {
  .pipeline { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .search { display: none; }
  .doc { padding: 20px; }
  .donut-wrap { grid-template-columns: 1fr; }
  .top h1 { font-size: 18px; }
  .li { grid-template-columns: auto 1fr; }
  .li > .tag { grid-column: 2; justify-self: start; }
  .bar-row { grid-template-columns: minmax(80px, 42%) 1fr auto; }
}

/* ---------------- Impressão ---------------- */
@media print {
  @page { size: A4; margin: 14mm; }
  body { background: #fff; font-size: 12px; }
  .side, .top, .no-print, .tabs, #toasts { display: none !important; }
  .app { display: block; }
  .view { padding: 0; max-width: none; }
  .doc { border: 0; box-shadow: none; padding: 0; }
  .doc h3 { break-after: avoid; }
  .doc table { break-inside: auto; } .doc tr { break-inside: avoid; }
  .doc .kpis { grid-template-columns: repeat(3, 1fr); }
  .chart, .avoid-break { break-inside: avoid; }
}

  /* ---------------------------------------------------------------------

  const KEY = 'iema-manutencao-predial-v1';

  /* ---------------------------------------------------------------------
     REGRAS: prazos, saldo da OS Contínuo e requisitos de cada etapa
     --------------------------------------------------------------------- */
  const R = (A.R = {});
  R.etapa = (id) => C.ETAPAS.find((e) => e.id === id) || { id: 8, nome: 'Concluída', curto: 'Concluída', cor: '#0B4F4A', resp: '—', ref: '' };
  R.crit = (id) => C.CRITICIDADE.find((c) => c.id === id) || C.CRITICIDADE[1];
  R.ativa = (d) => d.situacao === 'ativa';
  R.entradaEtapa = function (d, etapa) {
    etapa = etapa || d.etapa;

  R.diasNaEtapa = (d) => {

  R.sla = (d) => Number(S.cfg().sla[d.etapa]) || 0;

  /* Situação de prazo de uma demanda */
  R.prazo = function (d) {
    if (d.situacao === 'concluida') {
      const atrasou = d.fimPrevisto && d.fimReal && d.fimReal > d.fimPrevisto;
      return { k: 'concluida', label: atrasou ? 'Concluída com atraso' : 'Concluída', dias: 0 };
    }
    if (d.situacao === 'nao_aprovada') return { k: 'neutro', label: 'Não aprovada', dias: 0 };
    if (d.situacao === 'suspensa') return { k: 'suspensa', label: 'Suspensa', dias: 0 };
    const hoje = U.today();
    if (d.etapa <= 5 && d.fimPrevisto && hoje > d.fimPrevisto) return { k: 'atrasada', label: 'Obra em atraso', dias: U.diff(d.fimPrevisto, hoje) };
    const sla = R.sla(d), dias = R.diasNaEtapa(d);
    if (d.etapa !== 5 && sla && dias > sla) return { k: 'atrasada', label: 'Etapa acima do prazo', dias: dias - sla };
    if (d.etapa <= 5 && d.fimPrevisto && U.diff(hoje, d.fimPrevisto) <= 7) {
      const n = U.diff(hoje, d.fimPrevisto);

    }

    const total = (Number(cfg.valorOSContinuo) || 0) + U.sum(compl, (c) => c.valor);
    const itens = S.all().filter((d) => d.modalidade === 'Contínuo' && d.etapa >= 5 && d.situacao !== 'nao_aprovada' &&

      ano: ano, total: total, comprometido: comprometido, medido: medido, saldo: total - comprometido, itens: itens,

  R.rotulo = (k) => ({ titulo: 'título', unidade: 'unidade demandante', local: 'local', sistema: 'sistema afetado', descricao: 'descrição do problema', responsavelLocal: 'responsável pelo acompanhamento local' })[k] || k;
  R.requisitos = function (d) {
    const falta = [];
    const doc = (k) => !!d.docs[k];
    const docNome = (k) => { const x = C.DOCS.find((y) => y.id === k); return x.nome + ' (' + x.ref + ')'; };
    switch (d.etapa) {
      case 1:
        ['titulo', 'unidade', 'local', 'sistema', 'descricao', 'responsavelLocal'].forEach((k) => { if (!d[k]) falta.push('Preencher o campo ' + R.rotulo(k)); });

        out.push({ nivel: 'alto', d: d, titulo: 'Demanda crítica sem deliberação', texto: 'Na etapa de ' + R.etapa(d.etapa).curto.toLowerCase() + ' há ' + dias + ' dias.' });

        out.push({ nivel: 'medio', d: d, titulo: 'Risco declarado aguardando execução', texto: 'Risco a pessoas, patrimônio ou meio ambiente (Art. 8º, VI).' });
    });
    const s = R.saldoContinuo();
    const lim = Number(S.cfg().alertaSaldoPct) || 80;
    if (s.pct >= 100) out.unshift({ nivel: 'alto', titulo: 'OS Contínuo sem saldo', texto: 'Valor integralmente comprometido. Nenhum novo serviço até a OS complementar (Art. 19).' });
    else if (s.pct >= lim) out.unshift({ nivel: 'medio', titulo: 'Saldo da OS Contínuo em ' + U.pct(100 - s.pct), texto: 'Comprometidos ' + U.brl(s.comprometido) + ' de ' + U.brl(s.total) + '.' });
    if (s.fila.length && s.valorFila > s.saldo) out.unshift({ nivel: 'medio', titulo: 'Fila do Contínuo maior que o saldo', texto: s.fila.length + ' demanda(s) em andamento somam ' + U.brl(s.valorFila) + ' para um saldo de ' + U.brl(s.saldo) + '.' });

    const between = (a, b) => a + r() * (b - a);
    const iBetween = (a, b) => Math.round(between(a, b));

      const cont = base.modalidade === 'Contínuo';

      const extra = alvo === 8 ? iBetween(0, cont ? 200 : 120) : 0;
      let decorrido = 0;
      for (let k = 1; k < alvo; k++) decorrido += dur[k];
      const naAtual = alvo === 8 ? 0 : Math.round(dur[alvo] * between(0.1, 1.5));
      const inicio = U.addDays(hoje, -(decorrido + naAtual + extra));

      d.dataSolicitacao = inicio;

      d.situacao = alvo === 8 ? 'concluida' : 'ativa';
      if (alvo >= 5) { d.autorizadoEm = d.historico[4].data; d.inicioReal = d.autorizadoEm; }
      if (alvo >= 6) d.fimReal = d.historico[5].data;
      C.DOCS.forEach((x) => { d.docs[x.id] = x.etapa < alvo || (x.etapa === alvo && r() < 0.4); });
      d.docs.solicitacao = true;
      if (alvo >= 5) d.osNumero = cont ? cfg.osContinuoNumero : 'OS-P ' + String(iBetween(2, 60)).padStart(3, '0') + '/' + d.autorizadoEm.slice(0, 4);
      if (alvo >= 7) d.valorMedido = Math.round(d.valorEstimado * between(0.86, 1.0) * 100) / 100;
      if (alvo >= 8) d.nfNumero = String(iBetween(1000, 9800));

        responsavelLocal: pick(NOMES), pessoas: iBetween(8, 180), risco: (t[4] === 'Alta' || t[4] === 'Crítica') && r() < 0.6,
        descricao: t[0] + '. Demanda planejada e deliberada pelo colegiado de Diretores.',
        processo: ano + '-' + String(iBetween(10000, 99999)),
        fiscal: cfg.fiscais[0], gestor: cfg.gestores[0]
      };
      const d = montar(base);
      nP++;
      d.id = 'MP-' + d.dataSolicitacao.slice(0, 4) + '-' + String(nP).padStart(3, '0');
      lista.push(d);
    });

    let nC = 0;
    for (let rep = 0; rep < 2; rep++) {
      CONT.forEach((t, i) => {
        const localIdx = rep === 0 ? (t[4][0] === 4 ? 1 + (i % 8) : 0) : (i % 3 === 0 ? 0 : 1 + ((i + 3) % 8));
        const base = {
          titulo: t[0], sistema: t[1], modalidade: 'Contínuo', local: cfg.locais[localIdx], localInterno: pick(INTERNOS),
          valorEstimado: Math.round(between(t[2][0], t[2][1]) * 1.6 / 10) * 10, criticidade: t[3],
          setores: t[4].map((k) => cfg.setores[k]), unidade: cfg.setores[t[4][0]], solicitante: pick(NOMES),
          responsavelLocal: pick(NOMES), pessoas: iBetween(3, 90), risco: (t[3] === 'Alta' || t[3] === 'Crítica') && r() < 0.5,
          descricao: t[0] + '. Demanda rotineira com impacto imediato nas atividades.',
          processo: ano + '-' + String(iBetween(10000, 99999)),
          fiscal: cfg.fiscais[rep % 2], gestor: cfg.gestores[0]

        lista.push(d);

    na.situacao = 'nao_aprovada'; na.historico.push({ etapa: na.etapa, data: na.historico[na.historico.length - 1].data, tipo: 'nao_aprovada', nota: 'Não priorizada pelo colegiado neste exercício' });
    const su = lista.find((d) => d.modalidade === 'Contínuo' && d.etapa === 1 && d.situacao === 'ativa') || lista.find((d) => d.etapa === 3 && d.situacao === 'ativa');
    if (su) { su.situacao = 'suspensa'; su.historico.push({ etapa: su.etapa, data: hoje, tipo: 'suspensa', nota: 'Devolvida para complementação de dados obrigatórios (Art. 8º, § 3º)' }); }

    const log = [];
    lista.forEach((d) => d.historico.forEach((h) => log.push({
      em: h.data + 'T09:00:00.000Z', id: d.id, detalhe: d.titulo,
      acao: h.tipo === 'registro' ? 'Demanda criada' : h.tipo === 'avanço' ? (h.etapa === 8 ? 'Demanda concluída' : 'Avançou para ' + A.R.etapa(h.etapa).curto) : 'Situação alterada: ' + C.SITUACOES[h.tipo]
    })));
    log.sort((a, b) => (a.em < b.em ? 1 : -1));
    lista.sort((a, b) => (a.dataSolicitacao < b.dataSolicitacao ? 1 : -1));
    return { versao: 1, config: cfg, demandas: lista, log: log.slice(0, 300) };
  };
})(window.App);

            const inner = segs.map((s) => { const sa = X(s.ini < ini ? ini : s.ini), sb = X(U.addDays(s.fim, 1)); return '<i style="width:' + (((sb - sa) / tot) * 100).toFixed(2) + '%;background:' + R.etapa(s.etapa).cor + '" title="' + U.esc(R.etapa(s.etapa).nome + ': ' + U.fmt(s.ini) + ' a ' + U.fmt(s.fim)) + '"></i>'; }).join('');

     ===================================================================== */

      const form = U.$('#fcfg', el);

        if (act === 'zerar') UI.confirmar('Apagar todas as demandas', 'Todas as demandas e o histórico deste navegador serão apagados. As configurações são mantidas. Exporte antes se precisar de cópia.', 'Apagar', () => { S.data.demandas = []; S.data.log = []; S.registrar('Base de demandas apagada'); S.save(); U.toast('Demandas apagadas.'); });
        if (act === 'repo') {
          try { const r = await fetch('data/demandas.json', { cache: 'no-store' }); if (!r.ok) throw new Error(); const j = await r.json();
            UI.confirmar('Recarregar do repositório', 'Substituir os dados deste navegador por data/demandas.json (' + (j.demandas || []).length + ' demandas)?', 'Substituir', () => { S.substituir(j); U.toast('Dados do repositório carregados.', 'ok'); });
          } catch (err) { U.toast('Não foi possível ler data/demandas.json. Abra o site pelo GitHub Pages ou por um servidor local.', 'erro'); }
        }
      };
      el.onchange = (e) => {
        const t = e.target; if (t.dataset.act !== 'imp' || !t.files[0]) return;
        const rd = new FileReader();
        rd.onload = () => {
          try { const j = JSON.parse(rd.result); if (!Array.isArray(j.demandas)) throw new Error();
            UI.confirmar('Importar dados', 'Substituir os dados atuais por ' + j.demandas.length + ' demanda(s) do arquivo?', 'Importar', () => { S.substituir(j); U.toast('Dados importados.', 'ok'); });
          } catch (err) { U.toast('Arquivo inválido: o JSON precisa conter a lista "demandas".', 'erro'); }
        };
        rd.readAsText(t.files[0]);
        t.value = '';
      };
    }
  };
})(window.App);

/* =========================================================================
   gestor.js: Área do Gestor (dashboard, relatórios gerados automaticamente,
   saldo da OS Contínuo, alertas e registro de atividades)
   ========================================================================= */
(function (A) {
  'use strict';
  const U = A.U, C = A.C, S = A.S, R = A.R, UI = A.UI, Ch = A.Ch, V = A.V;
  const st = A.state;
  st.gestor = st.gestor || { tab: 'dashboard', ano: '', modalidade: '', rep: 'gerencial', repAno: '', repMod: '', repLocal: '', repDemanda: '', alNivel: '', logQ: '' };
  const G = st.gestor;
  const LOCK = 'iema-gestor-ok';
  const liberado = () => { try { return sessionStorage.getItem(LOCK) === '1'; } catch (e) { return !!A._gestorOK; } };
  const liberar = (v) => { try { v ? sessionStorage.setItem(LOCK, '1') : sessionStorage.removeItem(LOCK); } catch (e) { /* sem sessionStorage */ } A._gestorOK = v; };

  /* ---------------- Recortes de dados ---------------- */
  function recorte(ano, mod, local) {
    return S.all().filter((d) => (!ano || R.ano(d) === String(ano) || (d.situacao === 'concluida' && R.dataConclusao(d).slice(0, 4) === String(ano)) || (R.ativa(d) && R.ano(d) < String(ano))) &&
      (!mod || d.modalidade === mod) && (!local || d.local === local));
  }
  function mesesDoAno(ano) { const out = []; for (let m = 1; m <= 12; m++) out.push(ano + '-' + U.pad(m)); return out; }
  function anos() { const s = new Set(S.all().map(R.ano)); s.add(String(S.cfg().exercicio)); return Array.from(s).filter(Boolean).sort().reverse(); }

  function indicadores(lista, ano) {
    const ativas = lista.filter(R.ativa);
    const concl = lista.filter((d) => d.situacao === 'concluida' && (!ano || R.dataConclusao(d).slice(0, 4) === String(ano)));
    const autorizadas = lista.filter((d) => d.etapa >= 5 && d.situacao !== 'nao_aprovada' && (!ano || String(d.autorizadoEm || R.entradaEtapa(d, 5)).slice(0, 4) === String(ano)));
    const ciclos = concl.map(R.ciclo).filter((x) => x != null);
    const pontuais = concl.filter((d) => !(d.fimPrevisto && d.fimReal && d.fimReal > d.fimPrevisto));
    return {
      total: lista.length, ativas, concl, autorizadas,
      atraso: ativas.filter((d) => R.prazo(d).k === 'atrasada'),
      valorAutorizado: U.sum(autorizadas, (d) => d.valorEstimado),
      valorAtestado: U.sum(lista.filter((d) => d.etapa >= 7 && (!ano || String(R.entradaEtapa(d, 7)).slice(0, 4) === String(ano))), (d) => d.valorMedido),
      ciclo: ciclos.length ? U.sum(ciclos, (x) => x) / ciclos.length : 0,
      pontualidade: concl.length ? (pontuais.length / concl.length) * 100 : 0
    };
  }

  function porMes(lista, ano) {
    const ms = mesesDoAno(ano);
    const sol = ms.map((m) => lista.filter((d) => d.dataSolicitacao.slice(0, 7) === m).length);
    const con = ms.map((m) => lista.filter((d) => d.situacao === 'concluida' && R.dataConclusao(d).slice(0, 7) === m).length);
    let a1 = 0, a2 = 0;
    const aut = ms.map((m) => (a1 += U.sum(lista.filter((d) => d.etapa >= 5 && String(d.autorizadoEm || R.entradaEtapa(d, 5)).slice(0, 7) === m), (d) => d.valorEstimado)));
    const ate = ms.map((m) => (a2 += U.sum(lista.filter((d) => d.etapa >= 7 && String(R.entradaEtapa(d, 7)).slice(0, 7) === m), (d) => d.valorMedido)));
    return { cats: ms.map(U.mesLabel), sol, con, aut, ate };
  }

  /* ---------------- Blocos de gráfico reutilizados ---------------- */
  const B = {
    etapas(lista) {
      const at = lista.filter(R.ativa);
      return Ch.donut(C.ETAPAS.map((e) => ({ label: e.id + '. ' + e.curto, value: at.filter((d) => d.etapa === e.id).length, color: e.cor })), { sub: 'em andamento', aria: 'Demandas ativas por etapa' });
    },
    criticidade(lista) {
      const at = lista.filter(R.ativa);
      return Ch.donut(C.CRITICIDADE.map((c) => ({ label: c.id, value: at.filter((d) => d.criticidade === c.id).length, color: c.cor })), { sub: 'em andamento', aria: 'Demandas ativas por criticidade' });
    },
    modalidade(lista) {
      return Ch.donut([{ label: 'Programado', value: U.sum(lista.filter((d) => d.modalidade === 'Programado'), (d) => d.valorEstimado), color: 'var(--e4)' },
        { label: 'Contínuo', value: U.sum(lista.filter((d) => d.modalidade === 'Contínuo'), (d) => d.valorEstimado), color: 'var(--e1)' }],
      { fmt: U.brlCurto, center: U.brlCurto(U.sum(lista, (d) => d.valorEstimado)), sub: 'estimado', aria: 'Valor por modalidade' });
    },
    unidades(lista, n) {
      const g = U.groupBy(lista, (d) => d.unidade || 'Sem unidade');
      const rows = Object.keys(g).map((k) => ({ label: k, parts: [
        { value: U.sum(g[k].filter((d) => d.modalidade === 'Programado'), (d) => d.valorEstimado), color: 'var(--e4)', label: 'Programado' },
        { value: U.sum(g[k].filter((d) => d.modalidade === 'Contínuo'), (d) => d.valorEstimado), color: 'var(--e1)', label: 'Contínuo' }] }))
        .sort((a, b) => U.sum(b.parts, (p) => p.value) - U.sum(a.parts, (p) => p.value)).slice(0, n || 8);
      return Ch.hbars(rows, { fmt: U.brlCurto }) + Ch.legend([{ label: 'Programado', color: 'var(--e4)' }, { label: 'Contínuo', color: 'var(--e1)' }]);
    },
    sistemas(lista) {
      const rows = C.SISTEMAS.map((s) => ({ label: s, total: lista.filter((d) => d.sistema === s).length, color: 'var(--e3)' })).filter((r) => r.total).sort((a, b) => b.total - a.total);
      return Ch.hbars(rows);
    },
    mensal(lista, ano) {
      const m = porMes(lista, ano);
      return Ch.columns(m.cats, [{ name: 'Solicitações', color: 'var(--e1)', values: m.sol }, { name: 'Conclusões', color: 'var(--e6)', values: m.con }], { aria: 'Solicitações e conclusões por mês' });
    },
    financeiro(lista, ano, mod) {
      const m = porMes(lista, ano);
      const lim = mod === 'Contínuo' ? { value: R.saldoContinuo(ano).total, label: 'Valor da OS Contínuo', color: 'var(--bad)' } : null;
      return Ch.lines(m.cats, [{ name: 'Autorizado acumulado', color: 'var(--e4)', values: m.aut, area: true }, { name: 'Atestado acumulado', color: 'var(--e6)', values: m.ate }], { fmt: U.brlCurto, limit: lim, aria: 'Valores acumulados' });
    },
    sla(lista) { return Ch.slaBars(R.tempoMedioEtapas(lista), S.cfg().sla); }
  };

  function painel(t, meta, corpo, cls) { return '<section class="panel avoid-break ' + (cls || '') + '"><div class="panel-h"><h2>' + U.esc(t) + '</h2>' + (meta ? '<span class="meta">' + U.esc(meta) + '</span>' : '') + '</div><div class="panel-b">' + corpo + '</div></section>'; }
  function kpis(ind, extra) {
    return '<div class="kpis">' +
      V.kpi('Demandas no recorte', U.int(ind.total), U.int(ind.ativas.length) + ' em andamento', 'var(--e1)') +
      V.kpi('Em atraso', U.int(ind.atraso.length), ind.ativas.length ? U.pct((ind.atraso.length / ind.ativas.length) * 100) + ' das ativas' : 'nenhuma ativa', 'var(--bad)') +
      V.kpi('Concluídas', U.int(ind.concl.length), 'pontualidade de ' + U.pct(ind.pontualidade), 'var(--e6)') +
      V.kpi('Valor autorizado', U.brlCurto(ind.valorAutorizado), U.int(ind.autorizadas.length) + ' ordens executadas ou em execução', 'var(--e4)') +
      V.kpi('Valor atestado', U.brlCurto(ind.valorAtestado), ind.valorAutorizado ? U.pct((ind.valorAtestado / ind.valorAutorizado) * 100) + ' do autorizado' : '—', 'var(--e7)') +
      V.kpi('Ciclo médio', ind.ciclo ? Math.round(ind.ciclo) + ' dias' : '—', 'da solicitação à conclusão', 'var(--e2)') + (extra || '') + '</div>';
  }

  /* =====================================================================
     RELATÓRIOS
     ===================================================================== */
  const REL = [
    { id: 'gerencial', nome: 'Relatório gerencial consolidado', desc: 'Indicadores, etapas, prazos, financeiro e saldo do Contínuo.', cor: 'var(--brand)' },
    { id: 'prazos', nome: 'Prazos e atrasos', desc: 'Obras e etapas fora do prazo ou perto do vencimento.', cor: 'var(--bad)' },
    { id: 'setores', nome: 'Atendimento por setor', desc: 'Demandas, valores e sistemas por setor e por local.', cor: 'var(--e3)' },
    { id: 'continuo', nome: 'Execução da OS Contínuo', desc: 'Valor global, comprometido, medido, saldo e serviços.', cor: 'var(--e1)' },
    { id: 'cronograma', nome: 'Cronograma de obras', desc: 'Datas previstas e realizadas, com desvio em dias.', cor: 'var(--e5)' },
    { id: 'financeiro', nome: 'Financeiro e medições', desc: 'Estimado, medido e Nota Fiscal por demanda.', cor: 'var(--e7)' },
    { id: 'ficha', nome: 'Ficha da demanda', desc: 'Dados, documentos e histórico completo de uma demanda.', cor: 'var(--e2)' }
  ];
  function tabela(cab, linhas, rodape) {
    return '<div class="table-wrap"><table class="t"><thead><tr>' + cab.map((c) => '<th' + (c.r ? ' class="right"' : '') + '>' + U.esc(c.t || c) + '</th>').join('') + '</tr></thead><tbody>' +
      (linhas.length ? linhas.map((l) => '<tr class="static">' + l.map((c, i) => '<td' + (cab[i] && cab[i].r ? ' class="right nowrap"' : '') + '>' + c + '</td>').join('') + '</tr>').join('') : '<tr class="static"><td colspan="' + cab.length + '" class="muted">Nenhum registro no recorte.</td></tr>') +
      '</tbody>' + (rodape ? '<tfoot><tr>' + rodape.map((c, i) => '<td' + (cab[i] && cab[i].r ? ' class="right nowrap"' : '') + '>' + c + '</td>').join('') + '</tr></tfoot>' : '') + '</table></div>';
  }
  const e = U.esc;

  function gerarRelatorio() {
    const cfg = S.cfg(), ano = G.repAno || String(cfg.exercicio), mod = G.repMod, loc = G.repLocal;
    const lista = recorte(ano, mod, loc), ind = indicadores(lista, ano);
    const filtroTxt = 'Exercício ' + ano + (mod ? ' · modalidade ' + mod : '') + (loc ? ' · ' + loc : '');
    const def = REL.find((r) => r.id === G.rep);
    let corpo = '', csv = null;

    if (G.rep === 'gerencial') {
      const tm = R.tempoMedioEtapas(lista);
      const etapaRows = C.ETAPAS.map((x, i) => { const l = ind.ativas.filter((d) => d.etapa === x.id);
        return ['<span class="stage-label" style="--c:' + x.cor + '">' + x.id + '. ' + e(x.nome) + '</span>', e(x.resp), U.int(l.length), U.brl(U.sum(l, (d) => d.valorEstimado)), U.int(l.filter((d) => R.prazo(d).k === 'atrasada').length), tm[i].media.toFixed(1), x.id === 5 ? 'término previsto' : (cfg.sla[x.id] || '—')]; });
      const sc = R.saldoContinuo(ano);
      const atr = ind.atraso.slice(0, 12).map((d) => [e(d.id), e(d.titulo), e(d.local), UI.etapaLabel(d), e(R.prazo(d).label) + (R.prazo(d).dias ? ' (' + R.prazo(d).dias + 'd)' : '')]);
      corpo = kpis(ind) +
        '<h3>Demandas em andamento por etapa</h3>' + tabela(['Etapa', 'Responsável', { t: 'Ativas', r: 1 }, { t: 'Valor estimado', r: 1 }, { t: 'Em atraso', r: 1 }, { t: 'Média (dias)', r: 1 }, { t: 'Prazo (dias)', r: 1 }], etapaRows,
          ['Total', '', U.int(ind.ativas.length), U.brl(U.sum(ind.ativas, (d) => d.valorEstimado)), U.int(ind.atraso.length), '', '']) +
        '<div class="grid g2" style="margin-top:18px"><div class="avoid-break"><h3>Solicitações e conclusões por mês</h3>' + B.mensal(lista, ano) + '</div><div class="avoid-break"><h3>Tempo médio por etapa</h3>' + B.sla(lista) + '</div></div>' +
        '<div class="grid g2"><div class="avoid-break"><h3>Execução financeira acumulada</h3>' + B.financeiro(lista, ano, mod) + '</div><div class="avoid-break"><h3>Valor estimado por unidade demandante</h3>' + B.unidades(lista, 8) + '</div></div>' +
        '<h3>OS Contínuo ' + e(cfg.osContinuoNumero || '') + '</h3>' + tabela(['Valor global (com complementares)', { t: 'Comprometido', r: 1 }, { t: 'Medido', r: 1 }, { t: 'Saldo', r: 1 }, { t: 'Comprometimento', r: 1 }],
          [[U.brl(sc.total), U.brl(sc.comprometido), U.brl(sc.medido), U.brl(sc.saldo), U.pct(sc.pct)]]) +
        '<h3>Principais atrasos</h3>' + tabela(['Nº', 'Demanda', 'Local', 'Etapa', 'Situação'], atr);
    }

    if (G.rep === 'prazos') {
      const l = lista.filter((d) => R.ativa(d) && ['atrasada', 'atencao'].indexOf(R.prazo(d).k) >= 0).sort((a, b) => R.prazo(b).dias - R.prazo(a).dias);
      const rows = l.map((d) => { const p = R.prazo(d); return [e(d.id), e(d.titulo) + '<div class="sub">' + e(d.local) + '</div>', UI.etapaLabel(d), e(R.etapa(d.etapa).resp), R.diasNaEtapa(d) + (R.sla(d) ? ' / ' + R.sla(d) : ''), U.fmt(d.fimPrevisto), '<span class="tag ' + p.k + '">' + e(p.label) + (p.dias ? ' (' + p.dias + 'd)' : '') + '</span>']; });
      corpo = '<div class="kpis">' + V.kpi('Em atraso', U.int(l.filter((d) => R.prazo(d).k === 'atrasada').length), 'obra ou etapa fora do prazo', 'var(--bad)') +
        V.kpi('Em atenção', U.int(l.filter((d) => R.prazo(d).k === 'atencao').length), 'vencimento nos próximos dias', '#D97706') +
        V.kpi('Ativas no recorte', U.int(ind.ativas.length), 'total de referência', 'var(--e1)') + '</div>' +
        '<h3>Demandas fora do prazo ou em atenção</h3>' + tabela(['Nº', 'Demanda', 'Etapa', 'Responsável', { t: 'Dias na etapa / prazo', r: 1 }, 'Término previsto', 'Situação'], rows) +
        '<p class="muted small" style="margin-top:10px">Prazos por etapa definidos em Configurações. Na execução, a referência é o término previsto da obra.</p>';
      csv = [['Nº', 'Demanda', 'Local', 'Etapa', 'Responsável', 'Dias na etapa', 'Prazo da etapa', 'Término previsto', 'Situação', 'Dias de atraso']]
        .concat(l.map((d) => [d.id, d.titulo, d.local, R.etapa(d.etapa).nome, R.etapa(d.etapa).resp, R.diasNaEtapa(d), R.sla(d), U.fmt(d.fimPrevisto), R.prazo(d).label, R.prazo(d).dias]));
    }

    if (G.rep === 'setores') {
      const linhas = cfg.setores.map((s) => { const l = lista.filter((d) => d.setores.indexOf(s) >= 0); const at = l.filter(R.ativa);
        const sis = U.groupBy(l, (d) => d.sistema); const top = Object.keys(sis).sort((a, b) => sis[b].length - sis[a].length).slice(0, 2).join(', ');
        return { s, l, at, row: [e(s), U.int(at.length), U.int(at.filter((d) => R.prazo(d).k === 'atrasada').length), U.int(l.filter((d) => d.situacao === 'concluida').length), U.brl(U.sum(l, (d) => d.valorEstimado)), U.brl(U.sum(l, (d) => d.valorMedido)), e(top || '—')] }; })
        .filter((x) => x.l.length).sort((a, b) => b.l.length - a.l.length);
      const locs = cfg.locais.map((s) => { const l = lista.filter((d) => d.local === s); return { l, row: [e(s), U.int(l.filter(R.ativa).length), U.int(l.filter((d) => d.situacao === 'concluida').length), U.brl(U.sum(l, (d) => d.valorEstimado))] }; }).filter((x) => x.l.length);
      corpo = '<h3>Por setor atendido</h3>' + tabela(['Setor', { t: 'Ativas', r: 1 }, { t: 'Em atraso', r: 1 }, { t: 'Concluídas', r: 1 }, { t: 'Valor estimado', r: 1 }, { t: 'Valor atestado', r: 1 }, 'Sistemas mais frequentes'], linhas.map((x) => x.row)) +
        '<p class="muted small" style="margin-top:6px">Uma demanda pode atender mais de um setor; por isso a soma por setor pode superar o total geral.</p>' +
        '<h3>Por imóvel ou Unidade de Conservação</h3>' + tabela(['Local', { t: 'Ativas', r: 1 }, { t: 'Concluídas', r: 1 }, { t: 'Valor estimado', r: 1 }], locs.map((x) => x.row)) +
        '<div class="grid g2" style="margin-top:12px"><div class="avoid-break"><h3>Demandas por sistema afetado</h3>' + B.sistemas(lista) + '</div><div class="avoid-break"><h3>Valor por unidade demandante</h3>' + B.unidades(lista, 10) + '</div></div>';
      csv = [['Setor', 'Ativas', 'Em atraso', 'Concluídas', 'Valor estimado', 'Valor atestado', 'Sistemas mais frequentes']].concat(linhas.map((x) => [x.s, x.at.length, x.at.filter((d) => R.prazo(d).k === 'atrasada').length, x.l.filter((d) => d.situacao === 'concluida').length, U.sum(x.l, (d) => d.valorEstimado), U.sum(x.l, (d) => d.valorMedido), '']));
    }

    if (G.rep === 'continuo') {
      const sc = R.saldoContinuo(ano);
      const rows = sc.itens.slice().sort((a, b) => ((a.autorizadoEm || '') < (b.autorizadoEm || '') ? -1 : 1)).map((d) => [e(d.id), e(d.titulo) + '<div class="sub">' + e(d.local) + '</div>', U.fmt(d.autorizadoEm || R.entradaEtapa(d, 5)), UI.etapaLabel(d), U.brl(d.valorEstimado), d.valorMedido ? U.brl(d.valorMedido) : '—']);
      const compl = sc.complementares.map((c) => [e(c.numero || '—'), U.fmt(c.data), U.brl(c.valor)]);
      const ms = mesesDoAno(ano); let acc = 0;
      const serie = ms.map((m) => (acc += U.sum(sc.itens.filter((d) => String(d.autorizadoEm || R.entradaEtapa(d, 5)).slice(0, 7) === m), (d) => d.valorEstimado)));
      corpo = '<div class="grid g2"><div>' + Ch.gauge(sc.pct, { alerta: cfg.alertaSaldoPct }) + '</div><div class="kpis" style="grid-template-columns:1fr 1fr">' +
        V.kpi('Valor global', U.brlCurto(sc.total), 'OS ' + (cfg.osContinuoNumero || '—') + (sc.complementares.length ? ' + ' + sc.complementares.length + ' complementar(es)' : ''), 'var(--e1)') +
        V.kpi('Comprometido', U.brlCurto(sc.comprometido), U.int(sc.itens.length) + ' serviços autorizados', 'var(--e4)') +
        V.kpi('Medido e atestado', U.brlCurto(sc.medido), 'serviços em pagamento ou pagos', 'var(--e6)') +
        V.kpi('Saldo', U.brlCurto(sc.saldo), U.int(sc.fila.length) + ' na fila (' + U.brlCurto(sc.valorFila) + ')', sc.saldo <= 0 ? 'var(--bad)' : 'var(--e3)') + '</div></div>' +
        '<h3>Comprometimento acumulado no exercício</h3>' + Ch.lines(ms.map(U.mesLabel), [{ name: 'Comprometido acumulado', color: 'var(--e1)', values: serie, area: true }], { fmt: U.brlCurto, limit: { value: sc.total, label: 'Valor global', color: 'var(--bad)' } }) +
        '<h3>Serviços autorizados na OS Contínuo</h3>' + tabela(['Nº', 'Serviço', 'Autorizado em', 'Etapa', { t: 'Valor estimado', r: 1 }, { t: 'Valor medido', r: 1 }], rows, ['Total', '', '', '', U.brl(sc.comprometido), U.brl(sc.medido)]) +
        '<h3>OS complementares (Art. 19)</h3>' + tabela(['Nº', 'Data', { t: 'Valor', r: 1 }], compl);
      csv = [['Nº', 'Serviço', 'Local', 'Autorizado em', 'Etapa', 'Valor estimado', 'Valor medido']].concat(sc.itens.map((d) => [d.id, d.titulo, d.local, U.fmt(d.autorizadoEm), R.etapa(d.etapa).nome, d.valorEstimado, d.valorMedido]));
    }

    if (G.rep === 'cronograma') {
      const l = lista.filter((d) => d.situacao !== 'nao_aprovada').sort((a, b) => ((a.inicioPrevisto || '9') < (b.inicioPrevisto || '9') ? -1 : 1));
      const desvio = (d) => { const ref = d.fimReal || (d.etapa <= 5 && R.ativa(d) ? U.today() : ''); if (!ref || !d.fimPrevisto) return '—'; const n = U.diff(d.fimPrevisto, ref); return d.fimReal || n > 0 ? (n > 0 ? '+' + n : String(n)) : '—'; };
      corpo = tabela(['Nº', 'Obra', 'Setores atendidos', 'Início previsto', 'Término previsto', 'Início real', 'Término real', { t: 'Desvio (dias)', r: 1 }, 'Etapa'],
        l.map((d) => [e(d.id), e(d.titulo) + '<div class="sub">' + e(d.local) + '</div>', e(d.setores.join(', ')), U.fmt(d.inicioPrevisto), U.fmt(d.fimPrevisto), U.fmt(d.inicioReal), U.fmt(d.fimReal), desvio(d), UI.etapaLabel(d)])) +
        '<p class="muted small" style="margin-top:10px">Desvio positivo indica término real (ou situação atual, se ainda em execução) após o término previsto.</p>';
      csv = [['Nº', 'Obra', 'Local', 'Setores', 'Início previsto', 'Término previsto', 'Início real', 'Término real', 'Desvio (dias)', 'Etapa']].concat(l.map((d) => [d.id, d.titulo, d.local, d.setores.join(', '), U.fmt(d.inicioPrevisto), U.fmt(d.fimPrevisto), U.fmt(d.inicioReal), U.fmt(d.fimReal), desvio(d), R.etapa(d.etapa).nome]));
    }

    if (G.rep === 'financeiro') {
      const l = lista.filter((d) => d.etapa >= 4 && d.situacao !== 'nao_aprovada').sort((a, b) => (a.id < b.id ? -1 : 1));
      const tE = U.sum(l, (d) => d.valorEstimado), tM = U.sum(l, (d) => d.valorMedido);
      corpo = '<div class="kpis">' + V.kpi('Valor estimado', U.brlCurto(tE), U.int(l.length) + ' demandas com OS', 'var(--e4)') + V.kpi('Valor medido', U.brlCurto(tM), tE ? U.pct((tM / tE) * 100) + ' do estimado' : '—', 'var(--e6)') +
        V.kpi('Aguardando pagamento', U.brlCurto(U.sum(l.filter((d) => d.etapa === 7 && R.ativa(d)), (d) => d.valorMedido)), 'na etapa de pagamento', 'var(--e7)') + '</div>' +
        '<h3>Medições por demanda</h3>' + tabela(['Nº', 'Demanda', 'Modalidade', 'OS', { t: 'Estimado', r: 1 }, { t: 'Medido', r: 1 }, { t: 'Diferença', r: 1 }, 'NF', 'Etapa'],

    U.$('#theme-btn').setAttribute('aria-label', escuro ? 'Usar tema claro' : 'Usar tema escuro');

      UI.abrir(o.dataset.open);
    });
    document.addEventListener('keydown', (e) => {
      const tag = (e.target.tagName || '').toLowerCase();
      const digitando = tag === 'input' || tag === 'textarea' || tag === 'select' || e.target.isContentEditable;
      if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('[data-open][tabindex], [data-goto][tabindex]')) { e.preventDefault(); e.target.click(); return; }
      if (digitando || e.ctrlKey || e.metaKey || e.altKey || U.$('.modal')) return;
      if (e.key === '/') { e.preventDefault(); busca.focus(); }
      if (e.key === 'n' || e.key === 'N') { e.preventDefault(); UI.form(); }
    });
    window.addEventListener('hashchange', () => { U.$('.side').classList.remove('open'); UI.fechar(); window.scrollTo(0, 0); if (rota() !== 'demandas') busca.value = ''; A.render(); });
    window.addEventListener('storage', (e) => { if (e.key && e.key.indexOf('iema-manutencao-predial') === 0) { S.load().then(A.render); } });

    A.render();
    if (!S.persistente) U.toast('Armazenamento local indisponível: exporte os dados antes de fechar a página.', 'erro');
  }

  document.addEventListener('DOMContentLoaded', init);
})(window.App);

</script>
