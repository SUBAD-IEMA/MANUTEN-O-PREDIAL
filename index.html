/* =========================================================================
   Gestão de Manutenção Predial — IEMA
   Identidade: verde institucional + as sete cores das etapas da IS
   ========================================================================= */
:root {
  --brand: #0B4F4A;
  --brand-deep: #083B37;
  --brand-ink: #E6F4F1;
  --accent: #0F766E;
  --bg: #F2F5F4;
  --surface: #FFFFFF;
  --surface-2: #EBF0EE;
  --surface-3: #E1E8E6;
  --ink: #14232A;
  --ink-2: #33464C;
  --muted: #5E7075;
  --line: #D5DEDB;
  --line-2: #C3CFCB;
  --focus: #0EA5A0;

  --e1: #1D4ED8; --e2: #6D28D9; --e3: #0F766E; --e4: #BE123C; --e5: #475569; --e6: #15803D; --e7: #C2410C; --e8: #0B4F4A;

  --ok: #15803D; --ok-bg: #DCFCE7;
  --warn: #A16207; --warn-bg: #FEF3C7;
  --bad: #B91C1C; --bad-bg: #FEE2E2;
  --info: #1D4ED8; --info-bg: #DBEAFE;
  --neutral-bg: #E2E8F0;

  --r-lg: 14px; --r-md: 9px; --r-sm: 6px;
  --shadow: 0 1px 2px rgba(20, 35, 42, .06), 0 6px 18px -10px rgba(20, 35, 42, .18);
  --font: "Public Sans", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --side: 248px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C1514; --surface: #13201E; --surface-2: #1A2a27; --surface-3: #223532;
    --ink: #E4EEEC; --ink-2: #C3D2CF; --muted: #8FA3A0; --line: #263835; --line-2: #33504b; --focus: #2DD4BF;
    --ok-bg: #12301f; --warn-bg: #33270b; --bad-bg: #3a1515; --info-bg: #14234a; --neutral-bg: #233130;
    --ok: #4ADE80; --warn: #FBBF24; --bad: #F87171; --info: #93C5FD;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 20px -12px rgba(0, 0, 0, .6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C1514; --surface: #13201E; --surface-2: #1A2a27; --surface-3: #223532;
  --ink: #E4EEEC; --ink-2: #C3D2CF; --muted: #8FA3A0; --line: #263835; --line-2: #33504b; --focus: #2DD4BF;
  --ok-bg: #12301f; --warn-bg: #33270b; --bad-bg: #3a1515; --info-bg: #14234a; --neutral-bg: #233130;
  --ok: #4ADE80; --warn: #FBBF24; --bad: #F87171; --info: #93C5FD;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 20px -12px rgba(0, 0, 0, .6);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
body {
  font-family: var(--font); font-size: 15px; line-height: 1.5; color: var(--ink); background: var(--bg);
  -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums;
}
h1, h2, h3, h4 { margin: 0; line-height: 1.2; font-weight: 700; letter-spacing: -0.01em; }
p { margin: 0; }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* ---------------- Estrutura ---------------- */
.app { display: grid; grid-template-columns: var(--side) 1fr; min-height: 100vh; }
.side {
  background: var(--brand-deep); color: var(--brand-ink); position: sticky; top: 0; height: 100vh;
  display: flex; flex-direction: column; padding: 22px 14px 16px; overflow-y: auto;
}
.brand { padding: 0 8px 18px; border-bottom: 1px solid rgba(255, 255, 255, .1); margin-bottom: 14px; }
.brand-name { font-size: 17px; font-weight: 800; color: #fff; line-height: 1.15; }
.brand-org { font-size: 12.5px; color: #9CCFC7; margin-top: 4px; }
.brand-track { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; margin-top: 14px; }
.brand-track i { height: 5px; border-radius: 3px; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav a {
  display: flex; align-items: center; gap: 11px; padding: 9px 10px; border-radius: var(--r-md);
  color: #CFE6E1; text-decoration: none; font-weight: 500; font-size: 14.5px;
}
.nav a svg { width: 18px; height: 18px; flex: none; opacity: .85; }
.nav a:hover { background: rgba(255, 255, 255, .07); color: #fff; }
.nav a[aria-current="page"] { background: #fff; color: var(--brand-deep); font-weight: 700; }
.nav a[aria-current="page"] svg { opacity: 1; }
.nav .sep { height: 1px; background: rgba(255, 255, 255, .1); margin: 10px 6px; }
.nav .gestor { color: #FDE68A; }
.nav .gestor[aria-current="page"] { color: var(--brand-deep); }
.side-foot { margin-top: auto; padding: 14px 8px 0; font-size: 12px; color: #8CBDB5; }
.side-foot b { color: #CFE6E1; font-weight: 600; }

.main { min-width: 0; display: flex; flex-direction: column; }
.top {
  position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(8px); border-bottom: 1px solid var(--line);
  display: flex; align-items: center; gap: 12px; padding: 12px 28px;
}
.top h1 { font-size: 21px; }
.top .sub { color: var(--muted); font-size: 13.5px; }
.top-spacer { flex: 1; }
.search { position: relative; }
.search input {
  width: 260px; padding: 8px 12px 8px 34px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--surface);
}
.search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--muted); }
.btn.menu-btn { display: none; }
.view { padding: 24px 28px 48px; max-width: 1480px; width: 100%; }

/* ---------------- Botões e campos ---------------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 8px 14px; border-radius: var(--r-md);
  border: 1px solid var(--line-2); background: var(--surface); color: var(--ink); font-weight: 600; font-size: 14px;
  cursor: pointer; white-space: nowrap; text-decoration: none; line-height: 1.2;
}
.btn:hover { background: var(--surface-2); }
.btn svg { width: 16px; height: 16px; }
.btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
.btn.primary:hover { background: var(--brand-deep); }
.btn.danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, var(--line)); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--surface-2); }
.btn.sm { padding: 5px 10px; font-size: 13px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.icon-btn { width: 36px; height: 36px; padding: 0; border-radius: 999px; }

label.f { display: flex; flex-direction: column; gap: 5px; font-size: 13px; font-weight: 600; color: var(--ink-2); }
label.f .hint { font-weight: 400; color: var(--muted); font-size: 12px; }
.in, select.in, textarea.in {
  width: 100%; padding: 8px 10px; border-radius: var(--r-sm); border: 1px solid var(--line-2); background: var(--surface);
  font-weight: 400; font-size: 14px;
}
textarea.in { min-height: 84px; resize: vertical; }
.in:focus { outline: 2px solid var(--focus); outline-offset: 0; border-color: transparent; }
.in[aria-invalid="true"] { border-color: var(--bad); box-shadow: 0 0 0 1px var(--bad); }
.req::after { content: " *"; color: var(--bad); }
.check { display: flex; align-items: flex-start; gap: 9px; font-size: 14px; cursor: pointer; }
.check input { margin-top: 3px; width: 16px; height: 16px; accent-color: var(--brand); }

/* ---------------- Blocos ---------------- */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow); }
.panel-h { display: flex; align-items: baseline; justify-content: space-between; gap: 4px 12px; padding: 16px 18px 0; flex-wrap: wrap; }
.panel-h h2 { font-size: 16px; }
.panel-h .meta { color: var(--muted); font-size: 13px; }
.panel-b { padding: 14px 18px 18px; }
.grid { display: grid; gap: 18px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g-main { grid-template-columns: minmax(0, 1.65fr) minmax(0, 1fr); }
.stack { display: flex; flex-direction: column; gap: 18px; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.right { text-align: right; }
.nowrap { white-space: nowrap; }
.empty { padding: 28px; text-align: center; color: var(--muted); }
.empty b { display: block; color: var(--ink); font-size: 15px; margin-bottom: 4px; }


/* ---------------- Container queries para painéis ---------------- */
.panel { container-type: inline-size; }

/* KPIs */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 14px 16px; box-shadow: var(--shadow); border-top: 3px solid var(--c, var(--brand)); min-width: 0; }
.kpi .l { font-size: 13px; color: var(--muted); font-weight: 600; }
.kpi .v { font-size: clamp(17px, 1.42vw, 24px); font-weight: 800; letter-spacing: -0.02em; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi .s { font-size: 12.5px; color: var(--muted); }
.kpi .cmp { font-size: 12px; margin-top: 4px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; color: var(--muted); }
.delta { font-weight: 700; padding: 0 6px; border-radius: 999px; font-size: 11.5px; }
.delta.up { background: var(--ok-bg); color: var(--ok); } .delta.down { background: var(--bad-bg); color: var(--bad); } .delta.eq { background: var(--neutral-bg); color: var(--muted); }
.delta.inv.up { background: var(--bad-bg); color: var(--bad); } .delta.inv.down { background: var(--ok-bg); color: var(--ok); }

/* Selos */
.tag { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px; font-size: 12.5px; font-weight: 600; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.tag .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex: none; }
.tag.ok, .tag.concluida { background: var(--ok-bg); color: var(--ok); }
.tag.atencao, .tag.concluida-atraso { background: var(--warn-bg); color: var(--warn); }
.tag.atrasada, .tag.alerta { background: var(--bad-bg); color: var(--bad); }
.tag.neutro { background: var(--neutral-bg); color: var(--muted); }
.tag.mod { background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line); }
.sit { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: var(--ink-2); white-space: nowrap; }
.sit i { width: 9px; height: 9px; border-radius: 50%; background: var(--c); flex: none; }

/* Mini-andamento (5 marcas) */
.marks { display: inline-flex; gap: 3px; }
.marks i { width: 18px; height: 6px; border-radius: 3px; background: var(--surface-3); }
.marks i.on { background: var(--accent); }
.marks i.na { background: transparent; border: 1px dashed var(--line-2); height: 4px; margin-top: 1px; }

/* ---------------- Tabelas ---------------- */
.table-wrap { overflow-x: auto; }
table.t { width: 100%; border-collapse: collapse; font-size: 14px; }
.t th { text-align: left; font-size: 12.5px; color: var(--muted); font-weight: 700; padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--surface); }
.t th button { all: unset; cursor: pointer; display: inline-flex; gap: 4px; align-items: center; }
.t th button:focus-visible { outline: 2px solid var(--focus); }
.t th.right, .t td.right { text-align: right; }
.t td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.t tbody tr.click { cursor: pointer; }
.t tbody tr.click:hover td { background: var(--surface-2); }
.t .id { font-weight: 700; font-size: 13px; color: var(--ink-2); white-space: nowrap; }
.t .tt { font-weight: 600; max-width: 380px; }
.t .sub { font-size: 12.5px; color: var(--muted); }
.t tfoot td { font-weight: 700; border-bottom: 0; border-top: 2px solid var(--line-2); }
.t td a { white-space: nowrap; }
.t tr.grupo td { background: var(--surface-2); font-weight: 700; font-size: 13px; }
.t tr.filho td:first-child { padding-left: 28px; }

.filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.filters label.f { min-width: 150px; flex: 1 1 150px; max-width: 220px; }
.filters .grow { flex: 2 1 240px; max-width: none; }
.count { font-size: 13px; color: var(--muted); padding: 10px 18px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: center; }

.seg { display: inline-flex; background: var(--surface-2); border-radius: var(--r-md); padding: 3px; gap: 2px; border: 1px solid var(--line); flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 6px 12px; border-radius: 7px; font-weight: 600; font-size: 13.5px; cursor: pointer; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }

/* ---------------- Período e comparação ---------------- */
.periodo { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; padding: 14px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow); }
.periodo label.f { min-width: 140px; flex: 0 1 190px; }
.periodo .resumo { flex: 1 1 220px; font-size: 13px; color: var(--muted); align-self: center; text-align: right; }
.periodo .resumo b { color: var(--ink); }

/* ---------------- Gráficos ---------------- */
.chart { width: 100%; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart text { fill: var(--muted); font-family: var(--font); font-size: 11px; }
.chart .lbl { fill: var(--ink-2); font-weight: 600; }
.chart .val { fill: var(--ink); font-weight: 700; }
.chart .axis { stroke: var(--line-2); }
.chart .grid-l { stroke: var(--line); stroke-dasharray: 2 3; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12.5px; color: var(--ink-2); margin-top: 10px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; min-width: 0; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex: none; }
.donut-wrap { display: grid; grid-template-columns: minmax(120px, 160px) 1fr; gap: 18px; align-items: center; }
.donut-wrap .legend { flex-direction: column; margin: 0; gap: 7px; }
.donut-wrap .legend span { width: 100%; justify-content: flex-start; }
.donut-wrap .legend b { margin-left: auto; padding-left: 10px; white-space: nowrap; }
@container (max-width: 400px) { .donut-wrap { grid-template-columns: 1fr; justify-items: center; } .donut-wrap .chart { max-width: 170px; } .donut-wrap .legend { width: 100%; } }
.bars { display: flex; flex-direction: column; gap: 10px; }
.bar-row { display: grid; grid-template-columns: minmax(90px, 36%) 1fr minmax(64px, auto); gap: 10px; align-items: center; font-size: 13px; }
.bar-row .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink-2); font-weight: 600; }
.bar-row .bg { height: 12px; background: var(--surface-2); border-radius: 999px; overflow: hidden; display: flex; }
.bar-row .bg i { height: 100%; }
.bar-row .nv { font-weight: 700; text-align: right; white-space: nowrap; }
@container (max-width: 420px) { .bar-row { grid-template-columns: 1fr auto; } .bar-row .bg { grid-column: 1 / -1; order: 3; } }

/* Medidor de saldo */
.meter { display: grid; gap: 6px; }
.meter .m-top { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; flex-wrap: wrap; }
.meter .m-top b { font-size: 14px; }
.meter .track { position: relative; height: 14px; background: var(--surface-2); border-radius: 999px; overflow: hidden; border: 1px solid var(--line); }
.meter .track i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); border-radius: 999px; }
.meter.alerta .track i { background: var(--bad); }
.meter .track u { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--ink-2); opacity: .55; }
.meter .m-bot { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); gap: 10px; flex-wrap: wrap; }

/* Comparação */
.cmp-rows { display: flex; flex-direction: column; gap: 14px; }
.cmp-row { display: grid; grid-template-columns: minmax(130px, 28%) 1fr auto; gap: 12px; align-items: center; font-size: 13px; }
.cmp-row .nm { font-weight: 600; color: var(--ink-2); }
.cmp-row .bb { display: flex; flex-direction: column; gap: 4px; }
.cmp-row .bb span { display: grid; grid-template-columns: 1fr minmax(84px, auto); gap: 8px; align-items: center; }
.cmp-row .bb i { display: block; height: 9px; border-radius: 999px; }
.cmp-row .bb em { font-style: normal; font-size: 12px; text-align: right; white-space: nowrap; }
@container (max-width: 480px) { .cmp-row { grid-template-columns: 1fr auto; } .cmp-row .bb { grid-column: 1 / -1; } }

/* Listas e alertas */
.list { display: flex; flex-direction: column; }
.li { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; padding: 10px 2px; border-bottom: 1px solid var(--line); }
.li.click { cursor: pointer; } .li.click:hover { background: var(--surface-2); }
.li:last-child { border-bottom: 0; }
.li .date { text-align: center; min-width: 46px; border-radius: 8px; padding: 4px 6px; background: var(--surface-2); }
.li .date b { display: block; font-size: 17px; line-height: 1.1; }
.li .date span { font-size: 11px; color: var(--muted); }
.li .tt { font-weight: 600; font-size: 14px; }
.li .sub { font-size: 12.5px; color: var(--muted); }
.alert { display: grid; grid-template-columns: 5px 1fr auto; gap: 12px; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--surface); align-items: center; }
.alert.click { cursor: pointer; } .alert.click:hover { background: var(--surface-2); }
.alert .bar { align-self: stretch; border-radius: 3px; background: var(--muted); }
.alert.alto .bar { background: var(--bad); } .alert.medio .bar { background: #D97706; } .alert.baixo .bar { background: var(--info); }
.alert .tt { font-weight: 700; font-size: 14px; }
.alert .sub { font-size: 13px; color: var(--muted); }
.banner { display: flex; gap: 12px; align-items: flex-start; padding: 12px 16px; border-radius: var(--r-md); background: var(--bad-bg); color: var(--bad); border: 1px solid color-mix(in srgb, var(--bad) 30%, transparent); font-size: 14px; }
.banner b { display: block; }

.doc table.t td, .doc table.t th { border-color: #D5DEDB; padding: 7px 9px; font-size: 12.5px; color: #14232A; }
.doc .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.doc .kpi { box-shadow: none; background: #F8FAF9; border-color: #D5DEDB; color: #14232A; }

.doc .bar-row .bg, .doc .meter .track { background: #EBF0EE; }
.doc .foot { margin-top: 28px; padding-top: 10px; border-top: 1px solid #D5DEDB; font-size: 11.5px; color: #4B5C61; display: flex; justify-content: space-between; gap: 20px; }
.doc .banner { background: #FEE2E2; color: #991B1B; }

/* ---------------- Gaveta e modal ---------------- */
.scrim { position: fixed; inset: 0; background: rgba(8, 20, 19, .45); z-index: 40; opacity: 0; transition: opacity .18s; }
.scrim.on { opacity: 1; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(660px, 100%); background: var(--surface); z-index: 41; box-shadow: -10px 0 40px rgba(0, 0, 0, .25); display: flex; flex-direction: column; transform: translateX(100%); transition: transform .22s ease; }
.drawer.on { transform: none; }
.drawer-h { padding: 18px 22px 14px; border-bottom: 1px solid var(--line); }
.drawer-h .row1 { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
.drawer-h h2 { font-size: 19px; margin-top: 4px; }
.drawer-b { padding: 18px 22px 30px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 22px; }
.drawer-f { padding: 12px 22px; border-top: 1px solid var(--line); display: flex; gap: 8px; flex-wrap: wrap; background: var(--surface-2); }
.sec-t { font-size: 14px; font-weight: 700; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
dl.kv { display: grid; grid-template-columns: 190px 1fr; gap: 7px 14px; margin: 0; font-size: 14px; }
dl.kv dt { color: var(--muted); font-size: 13px; }

.etapas { border: 1px solid var(--line); border-radius: var(--r-md); overflow: hidden; }

.etapa input[disabled] { cursor: not-allowed; }
.etapa .nm { font-weight: 700; font-size: 14.5px; }
.etapa .nm small { font-weight: 500; color: var(--muted); margin-left: 6px; font-size: 12px; }
.etapa .info { font-size: 13px; color: var(--muted); margin-top: 2px; }

.modal { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 20px; }
.modal .scrim { z-index: 0; opacity: 1; position: fixed; }
.modal .box { position: relative; z-index: 1; background: var(--surface); border-radius: var(--r-lg); width: min(880px, 100%); max-height: calc(100vh - 40px); display: flex; flex-direction: column; box-shadow: 0 30px 80px rgba(0, 0, 0, .35); }

.modal-h h2 { font-size: 18px; }
.modal-b { padding: 18px 22px; overflow-y: auto; }
.modal-f { padding: 12px 22px; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
fieldset.fs { border: 0; padding: 0; margin: 0 0 22px; }
fieldset.fs legend { font-weight: 700; font-size: 15px; padding: 0 0 8px; margin-bottom: 10px; border-bottom: 1px solid var(--line); width: 100%; }
.fgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 14px; }
.fgrid.c3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }

.perm-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 16px; }

/* Login */
.login { min-height: 100vh; display: grid; place-items: center; padding: 24px; background: var(--brand-deep); }

/* Usuário e conexão na barra lateral */
.user-box { margin-top: auto; padding: 14px 8px 0; border-top: 1px solid rgba(255,255,255,.1); font-size: 12.5px; color: #9CCFC7; display: flex; flex-direction: column; gap: 6px; }
.user-box b { color: #fff; font-size: 13.5px; }

.conn { display: inline-flex; align-items: center; gap: 6px; }

.loading { position: fixed; top: 0; left: 0; right: 0; height: 3px; z-index: 70; background: linear-gradient(90deg, transparent, var(--focus), transparent); background-size: 200% 100%; animation: ld 1s linear infinite; }

.gantt { display: grid; grid-template-columns: 300px 1fr; border-top: 1px solid var(--line); }
.g-left { border-right: 1px solid var(--line); background: var(--surface); position: relative; z-index: 2; }
.g-right { overflow-x: auto; position: relative; }
.g-canvas { position: relative; }
.g-head { height: 46px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--surface); z-index: 3; }
.g-left .g-head { display: flex; align-items: flex-end; padding: 0 14px 8px; font-size: 12.5px; color: var(--muted); font-weight: 700; }
.g-mon { position: absolute; top: 0; height: 26px; font-size: 12px; font-weight: 700; color: var(--ink-2); padding: 5px 6px; border-left: 1px solid var(--line); white-space: nowrap; overflow: hidden; }
.g-tick { position: absolute; top: 26px; height: 20px; font-size: 11px; color: var(--muted); padding: 2px 4px; border-left: 1px solid var(--line); white-space: nowrap; }
.g-row { height: 46px; border-bottom: 1px solid var(--line); position: relative; }

.g-left .g-row .b { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.g-group { height: 34px; background: var(--surface-2); border-bottom: 1px solid var(--line); font-size: 12.5px; font-weight: 700; display: flex; align-items: center; padding: 0 14px; color: var(--ink-2); }
.g-grid { position: absolute; top: 0; bottom: 0; border-left: 1px solid var(--line); opacity: .7; }
.g-today { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--bad); z-index: 4; pointer-events: none; }
.g-today span { position: absolute; top: 28px; left: 4px; font-size: 11px; font-weight: 700; color: var(--bad); background: var(--surface); padding: 0 4px; border-radius: 4px; white-space: nowrap; }
.g-plan { position: absolute; top: 9px; height: 10px; border: 1.5px dashed var(--ink-2); border-radius: 4px; opacity: .55; }
.g-real { position: absolute; top: 23px; height: 14px; border-radius: 4px; cursor: pointer; box-shadow: 0 1px 2px rgba(0,0,0,.15); }
.g-legend { display: flex; flex-wrap: wrap; gap: 14px; padding: 12px 18px; font-size: 12.5px; color: var(--muted); align-items: center; }
.g-legend span { display: inline-flex; align-items: center; gap: 6px; }
.g-legend i { width: 14px; height: 10px; border-radius: 3px; display: inline-block; }
.heat td.h { text-align: center; font-weight: 700; font-size: 12.5px; min-width: 44px; }
.heat th.v { writing-mode: vertical-rl; transform: rotate(180deg); height: 160px; vertical-align: bottom; padding: 8px 6px; white-space: nowrap; }

#toasts { position: fixed; bottom: 18px; right: 18px; display: flex; flex-direction: column; gap: 8px; z-index: 80; }
.toast { background: var(--ink); color: var(--surface); padding: 11px 16px; border-radius: var(--r-md); font-size: 14px; font-weight: 500; box-shadow: var(--shadow); max-width: 420px; transition: opacity .4s, transform .4s; }
.toast.ok { background: var(--ok); color: #fff; } .toast.erro { background: var(--bad); color: #fff; }
.toast.out { opacity: 0; transform: translateY(8px); }
.notice { padding: 10px 14px; border-radius: var(--r-md); background: var(--warn-bg); color: var(--warn); font-size: 13.5px; font-weight: 500; }
.notice.info { background: var(--info-bg); color: var(--info); }
code { font-size: 12.5px; background: var(--surface-2); padding: 1px 5px; border-radius: 4px; }

/* ---------------- Responsivo ---------------- */
@media (max-width: 1180px) { .g-main, .g3 { grid-template-columns: 1fr; } }
@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; }

  .view { padding: 18px 16px 40px; }

}
@media (max-width: 600px) {

}

/* ---------------- Impressão ---------------- */
@media print {

  .doc .kpis { grid-template-columns: repeat(3, 1fr); }
  .chart, .avoid-break { break-inside: avoid; }
}

   Toda gravação registra o histórico e devolve os dados atualizados.
   ========================================================================= */
var Servico = (function (L) {
  'use strict';
  var S = {};

  function Erro(codigo, mensagem) { this.codigo = codigo; this.mensagem = mensagem; }
  function falha(codigo, mensagem) { throw new Erro(codigo, mensagem); }

  /* ---------------- Sessão ---------------- */
  function perfilDe(repo, nome) {
    var p = repo.listar('Perfis').filter(function (x) { return x.nome === nome; })[0];
    return p || null;
  }
  function sessao(repo, token) {
    if (!token) falha('SESSAO', 'Sessão expirada. Entre novamente.');
    var login = repo.tokenLer(token);
    if (!login) falha('SESSAO', 'Sessão expirada. Entre novamente.');
    var u = repo.listar('Usuarios').filter(function (x) { return x.login === login; })[0];
    if (!u || !u.ativo) falha('SESSAO', 'Usuário inativo ou removido.');
    var p = perfilDe(repo, u.perfil);
    if (!p) falha('PERFIL', 'O perfil "' + u.perfil + '" não existe mais. Procure o gestor master.');
    return { login: u.login, nome: u.nome, usuario: u, perfil: p };
  }
  function exigir(cond, msg) { if (!cond) falha('PERMISSAO', msg || 'Seu perfil não permite esta ação.'); }
  function conferirSenha(ses, senha) {
    if (!senha) falha('SENHA', 'Confirme a operação com a sua senha.');
    if (L.hashSenha(senha, ses.usuario.salt) !== ses.usuario.hash) falha('SENHA', 'Senha incorreta. A alteração não foi gravada.');
  }
  function hist(repo, ses, acao, demandaId, campo, anterior, novo, motivo) {
    return { em: repo.agora(), usuario: ses.login, perfil: ses.perfil.nome, acao: acao, demandaId: demandaId || '', campo: campo || '', anterior: anterior == null ? '' : String(anterior), novo: novo == null ? '' : String(novo), motivo: motivo || '' };
  }
  function publico(u) { return { login: u.login, nome: u.nome, email: u.email, perfil: u.perfil, ativo: u.ativo, trocarSenha: u.trocarSenha, criadoEm: u.criadoEm }; }

  /* ---------------- Dados visíveis para a sessão ---------------- */
  function montarDados(repo, ses) {
    var p = ses.perfil;
    var cfg = repo.config();
    var demandas = repo.listar('Demandas');
    if (!p.verTodas) demandas = demandas.filter(function (d) { return d.criadoPor === ses.login; });
    var ids = {};
    demandas.forEach(function (d) { ids[d.id] = 1; });
    var nfs = repo.listar('NotasFiscais').filter(function (n) { return ids[n.demandaId]; });
    var verFin = p.financeiro || p.areaGestor;
    var usuarios = repo.listar('Usuarios');
    var nomes = {};
    usuarios.forEach(function (u) { nomes[u.login] = u.nome; });
    var historico = repo.listar('Historico');
    if (!p.areaGestor) historico = historico.filter(function (h) { return ids[h.demandaId]; });
    if (historico.length > 4000) historico = historico.slice(historico.length - 4000);
    if (!p.configuracoes) delete cfg.emailsBackup;
    return {
      versao: repo.versao(), config: cfg, lotes: repo.listar('Lotes'), empenhos: verFin ? repo.listar('Empenhos') : [],
      demandas: demandas, nfs: nfs, perfis: repo.listar('Perfis'), nomes: nomes,
      usuarios: p.usuarios ? usuarios.map(publico) : [], historico: historico.reverse(),
      sessao: { login: ses.login, nome: ses.nome, perfil: p, trocarSenha: ses.usuario.trocarSenha }
    };
  }
  function dadosCompletos(repo) {
    return { config: repo.config(), lotes: repo.listar('Lotes'), empenhos: repo.listar('Empenhos'), demandas: repo.listar('Demandas'), nfs: repo.listar('NotasFiscais') };
  }

  /* =====================================================================
     AÇÕES
     ===================================================================== */
  var A = {};

  A.versao = function (repo) { return { versao: repo.versao() }; };

  A.login = function (repo, req) {
    var login = String(req.login || '').trim().toLowerCase();
    var u = repo.listar('Usuarios').filter(function (x) { return x.login.toLowerCase() === login; })[0];
    if (!u || L.hashSenha(String(req.senha || ''), u.salt) !== u.hash) falha('LOGIN', 'Login ou senha incorretos.');
    if (!u.ativo) falha('LOGIN', 'Usuário desativado. Procure o gestor master.');
    var token = repo.uuid() + repo.uuid();
    repo.tokenSalvar(token, u.login);
    var ses = sessao(repo, token);
    repo.historico([hist(repo, ses, 'Entrada no sistema')]);
    return { token: token, dados: montarDados(repo, ses) };
  };

  A.sair = function (repo, req) { if (req.token) repo.tokenRemover(req.token); return { ok: true }; };

  A.dados = function (repo, req) { return { dados: montarDados(repo, sessao(repo, req.token)) }; };

  A.trocarSenha = function (repo, req) {
    var ses = sessao(repo, req.token);
    conferirSenha(ses, req.senhaAtual);
    var nova = String(req.novaSenha || '');
    if (nova.length < 6) falha('VALIDACAO', 'A nova senha precisa ter ao menos 6 caracteres.');
    var u = ses.usuario;
    u.salt = repo.uuid();
    u.hash = L.hashSenha(nova, u.salt);
    u.trocarSenha = false;
    repo.salvar('Usuarios', u);
    repo.historico([hist(repo, ses, 'Senha alterada pelo próprio usuário')]);
    return { dados: montarDados(repo, ses) };
  };

  /* ---------------- Demandas ---------------- */
  A.salvarDemanda = function (repo, req) {
    var ses = sessao(repo, req.token), p = ses.perfil;
    var entrada = req.demanda || {};
    var todas = repo.listar('Demandas');
    var antes = entrada.id ? todas.filter(function (x) { return x.id === entrada.id; })[0] : null;
    var registros = [];
    var nfsDem = function (id) { return repo.listar('NotasFiscais').filter(function (n) { return n.demandaId === id; }).length; };
    var lotes = repo.listar('Lotes');
    var d;

    if (!antes) {
      exigir(p.criar, 'Seu perfil não permite registrar demandas.');
      d = L.normalizar('Demandas', {});
      L.CAMPOS_EDITAVEIS.forEach(function (k) { if (entrada[k] !== undefined && L.podeEditarCampo(p, k, null, ses.login)) d[k] = entrada[k]; });
      d = L.normalizar('Demandas', d);
      if (!p.campos || p.campos.indexOf('identificacao') < 0) falha('PERMISSAO', 'Seu perfil não permite preencher os dados da demanda.');
      var faltam = L.validarObrigatorios(d);
      if (faltam.length) falha('VALIDACAO', 'Preencha os campos obrigatórios: ' + faltam.join(', ') + '.');
      if (!lotes.some(function (l) { return l.id === d.loteId; })) falha('VALIDACAO', 'Selecione um lote cadastrado. Toda demanda precisa estar vinculada a um lote.');
      var ano = String(d.dataSolicitacao).slice(0, 4);
      var pre = (d.modalidade === 'Contínuo' ? 'MC' : 'MP') + '-' + ano + '-';
      var nums = todas.filter(function (x) { return x.id.indexOf(pre) === 0; }).map(function (x) { return parseInt(x.id.slice(pre.length), 10) || 0; });
      d.id = pre + ('00' + ((nums.length ? Math.max.apply(null, nums) : 0) + 1)).slice(-3);
      d.criadoPor = ses.login;
      d.criadoEm = repo.agora();
      registros.push(hist(repo, ses, 'Demanda registrada', d.id, '', '', d.titulo, ''));
    } else {
      var visivel = p.verTodas || antes.criadoPor === ses.login;
      exigir(visivel, 'Você não tem acesso a esta demanda.');
      d = L.normalizar('Demandas', antes);
      L.CAMPOS_EDITAVEIS.forEach(function (k) { if (entrada[k] !== undefined) d[k] = entrada[k]; });
      d = L.normalizar('Demandas', d);
      var an = L.analisarAlteracao(antes, d);
      if (!an.mudancas.length) return { semAlteracao: true, dados: montarDados(repo, ses) };
      an.mudancas.forEach(function (m) {
        if (!L.podeEditarCampo(p, m.campo, antes, ses.login)) falha('PERMISSAO', 'Seu perfil não permite alterar o campo "' + (L.ROTULOS[m.campo] || m.campo) + '"' + (!p.editarOutras && antes.inicialOk ? ', pois a demanda já foi recebida pelo gestor' : '') + '.');
      });
      if (an.exigeSenha) {
        conferirSenha(ses, req.senha);
        if (!String(req.motivo || '').trim()) falha('VALIDACAO', 'Informe o motivo da alteração.');
      }
      var falt = L.validarObrigatorios(d);
      if (falt.length) falha('VALIDACAO', 'Preencha os campos obrigatórios: ' + falt.join(', ') + '.');
      if (!lotes.some(function (l) { return l.id === d.loteId; })) falha('VALIDACAO', 'Selecione um lote cadastrado.');
      var etapasMudadas = {};
      an.mudancas.forEach(function (m) {
        var et = L.etapaDoCampo(m.campo);
        if (et && m.campo === et.id + 'Ok') {
          etapasMudadas[et.id] = 1;
          registros.push(hist(repo, ses, (d[m.campo] ? 'Etapa marcada: ' : 'Etapa desmarcada: ') + et.nome, d.id, L.ROTULOS[m.campo], m.anterior, m.novo, req.motivo));
        } else {
          registros.push(hist(repo, ses, an.exigeSenha ? 'Alteração com senha' : 'Demanda alterada', d.id, L.ROTULOS[m.campo] || m.campo, m.anterior, m.novo, req.motivo));
        }
      });
      L.ETAPAS.forEach(function (e) { if (etapasMudadas[e.id]) d[e.id + 'Por'] = d[e.id + 'Ok'] ? ses.login : ''; });
    }
    if (d.inicialOk && !d.inicialData) d.inicialData = L.hoje();
    if (!d.inicioPrevisto) d.inicioPrevisto = d.dataSolicitacao;
    d.fimPrevisto = L.fimPrevisto(d.inicioPrevisto, d.prazoQtd, d.prazoUnidade);
    var erros = L.validarEtapas(d, antes ? nfsDem(d.id) : 0);
    if (erros.length) falha('VALIDACAO', erros.join(' '));
    if (!antes && L.ETAPAS.some(function (e) { return d[e.id + 'Ok']; })) L.ETAPAS.forEach(function (e) { if (d[e.id + 'Ok']) d[e.id + 'Por'] = ses.login; });
    d.atualizadoPor = ses.login;
    d.atualizadoEm = repo.agora();
    repo.salvar('Demandas', d);
    repo.historico(registros);
    return { id: d.id, dados: montarDados(repo, ses) };
  };

  A.excluirDemanda = function (repo, req) {
    var ses = sessao(repo, req.token);
    exigir(ses.perfil.excluir, 'Seu perfil não permite excluir demandas.');
    conferirSenha(ses, req.senha);
    var d = repo.listar('Demandas').filter(function (x) { return x.id === req.id; })[0];
    if (!d) falha('VALIDACAO', 'Demanda não encontrada.');
    if (repo.listar('NotasFiscais').some(function (n) { return n.demandaId === d.id; })) falha('VALIDACAO', 'A demanda tem Notas Fiscais. Exclua as notas antes ou use "Cancelar demanda".');
    repo.remover('Demandas', d.id);
    repo.historico([hist(repo, ses, 'Demanda excluída', d.id, '', d.titulo, '', req.motivo)]);
    return { dados: montarDados(repo, ses) };
  };

  /* ---------------- Notas fiscais ---------------- */
  A.salvarNF = function (repo, req) {
    var ses = sessao(repo, req.token);
    exigir(ses.perfil.financeiro, 'Seu perfil não permite lançar Notas Fiscais.');
    var nf = L.normalizar('NotasFiscais', req.nf || {});
    var todas = repo.listar('NotasFiscais');
    var antes = nf.id ? todas.filter(function (x) { return x.id === nf.id; })[0] : null;
    var d = repo.listar('Demandas').filter(function (x) { return x.id === nf.demandaId; })[0];
    if (!d) falha('VALIDACAO', 'Demanda não encontrada.');
    if (!d.atesteOk) falha('VALIDACAO', 'A Nota Fiscal só pode ser registrada depois do ateste.');
    if (!nf.numero) falha('VALIDACAO', 'Informe o número da Nota Fiscal.');
    if (!(nf.valor > 0)) falha('VALIDACAO', 'Informe o valor do serviço da Nota Fiscal.');
    if (!nf.data) falha('VALIDACAO', 'Informe a data de emissão.');
    if (!nf.empenhoId) falha('VALIDACAO', 'Vincule a Nota Fiscal a um empenho.');
    var base = dadosCompletos(repo);
    if (antes) base.nfs = base.nfs.filter(function (x) { return x.id !== antes.id; });
    var fin = L.financeiro(base);
    var fam = L.familiaDoEmpenho(fin, nf.empenhoId);
    if (!fam) falha('VALIDACAO', 'Empenho não encontrado.');
    if (nf.valor > fam.saldo + 0.004) falha('SALDO', 'O empenho ' + fam.empenho.numero + ' tem saldo de ' + L.brl(fam.saldo) + ', insuficiente para esta nota. Cadastre um reforço de empenho.');
    if (antes || d.pagamentoOk) {
      conferirSenha(ses, req.senha);
      if (!String(req.motivo || '').trim()) falha('VALIDACAO', 'Informe o motivo da alteração.');
    }
    var registros = [];
    if (antes) {
      ['numero', 'valor', 'data', 'empenhoId', 'obs'].forEach(function (k) {
        if (String(antes[k]) !== String(nf[k])) registros.push(hist(repo, ses, 'Nota Fiscal alterada', d.id, 'NF ' + antes.numero + ': ' + L.TABELAS.NotasFiscais.colunas.filter(function (c) { return c[0] === k; })[0][1], antes[k], nf[k], req.motivo));
      });
      nf.registradoPor = antes.registradoPor; nf.registradoEm = antes.registradoEm;
    } else {
      nf.id = 'NF' + repo.uuid().slice(0, 8).toUpperCase();
      nf.registradoPor = ses.login; nf.registradoEm = repo.agora();
      registros.push(hist(repo, ses, 'Nota Fiscal registrada', d.id, 'NF ' + nf.numero, '', nf.valor, req.motivo));
    }
    repo.salvar('NotasFiscais', nf);
    repo.historico(registros);
    return { dados: montarDados(repo, ses) };
  };
  A.excluirNF = function (repo, req) {
    var ses = sessao(repo, req.token);
    exigir(ses.perfil.financeiro, 'Seu perfil não permite excluir Notas Fiscais.');
    conferirSenha(ses, req.senha);
    if (!String(req.motivo || '').trim()) falha('VALIDACAO', 'Informe o motivo da exclusão.');
    var nfs = repo.listar('NotasFiscais'), nf = nfs.filter(function (x) { return x.id === req.id; })[0];
    if (!nf) falha('VALIDACAO', 'Nota Fiscal não encontrada.');
    var d = repo.listar('Demandas').filter(function (x) { return x.id === nf.demandaId; })[0];
    if (d && d.pagamentoOk && nfs.filter(function (x) { return x.demandaId === d.id; }).length === 1) falha('VALIDACAO', 'Esta é a única nota de uma demanda paga. Desmarque o pagamento antes de excluí-la.');
    repo.remover('NotasFiscais', nf.id);
    repo.historico([hist(repo, ses, 'Nota Fiscal excluída', nf.demandaId, 'NF ' + nf.numero, nf.valor, '', req.motivo)]);
    return { dados: montarDados(repo, ses) };
  };

  /* ---------------- Empenhos e lotes ---------------- */
  A.salvarEmpenho = function (repo, req) {
    var ses = sessao(repo, req.token);
    exigir(ses.perfil.financeiro, 'Seu perfil não permite cadastrar empenhos.');
    var e = L.normalizar('Empenhos', req.empenho || {});
    var todos = repo.listar('Empenhos');
    var antes = e.id ? todos.filter(function (x) { return x.id === e.id; })[0] : null;
    if (!e.numero) falha('VALIDACAO', 'Informe o número do empenho.');
    if (!(e.valor > 0)) falha('VALIDACAO', 'Informe o valor do empenho.');
    if (e.tipo !== 'Novo' && e.tipo !== 'Reforço') falha('VALIDACAO', 'Indique se o empenho é novo ou reforço.');
    if (e.tipo === 'Reforço') {
      var orig = todos.filter(function (x) { return x.id === e.vinculadoA && x.tipo === 'Novo'; })[0];
      if (!orig) falha('VALIDACAO', 'Selecione o empenho novo ao qual este reforço está vinculado.');
    } else e.vinculadoA = '';
    if (todos.some(function (x) { return x.numero === e.numero && x.id !== e.id; })) falha('VALIDACAO', 'Já existe um empenho com o número ' + e.numero + '.');
    if (antes) {
      conferirSenha(ses, req.senha);
      var base = dadosCompletos(repo);
      base.empenhos = base.empenhos.map(function (x) { return x.id === e.id ? e : x; });
      var fam = L.familiaDoEmpenho(L.financeiro(base), e.id);
      if (fam && fam.saldo < -0.004) falha('SALDO', 'Com esse valor, o empenho ficaria com saldo negativo diante das notas já lançadas.');
      if (antes.tipo === 'Novo' && e.tipo === 'Reforço' && todos.some(function (x) { return x.vinculadoA === e.id; })) falha('VALIDACAO', 'Este empenho tem reforços vinculados e não pode virar reforço.');
    } else e.id = 'EMP' + repo.uuid().slice(0, 8).toUpperCase();
    repo.salvar('Empenhos', e);
    repo.historico([hist(repo, ses, antes ? 'Empenho alterado' : 'Empenho cadastrado (' + e.tipo + ')', '', e.numero, antes ? antes.valor : '', e.valor, req.motivo)]);
    return { dados: montarDados(repo, ses) };
  };
  A.excluirEmpenho = function (repo, req) {
    var ses = sessao(repo, req.token);
    exigir(ses.perfil.financeiro, 'Seu perfil não permite excluir empenhos.');
    conferirSenha(ses, req.senha);
    var e = repo.listar('Empenhos').filter(function (x) { return x.id === req.id; })[0];
    if (!e) falha('VALIDACAO', 'Empenho não encontrado.');
    if (repo.listar('NotasFiscais').some(function (n) { return n.empenhoId === e.id; })) falha('VALIDACAO', 'O empenho tem Notas Fiscais vinculadas e não pode ser excluído.');
    if (repo.listar('Empenhos').some(function (x) { return x.vinculadoA === e.id; })) falha('VALIDACAO', 'Exclua antes os reforços vinculados a este empenho.');
    repo.remover('Empenhos', e.id);
    repo.historico([hist(repo, ses, 'Empenho excluído', '', e.numero, e.valor, '', req.motivo)]);
    return { dados: montarDados(repo, ses) };
  };
  A.salvarLote = function (repo, req) {
    var ses = sessao(repo, req.token);
    exigir(ses.perfil.financeiro || ses.perfil.configuracoes, 'Seu perfil não permite cadastrar lotes.');
    var l = L.normalizar('Lotes', req.lote || {});
    var todos = repo.listar('Lotes');
    var antes = l.id ? todos.filter(function (x) { return x.id === l.id; })[0] : null;
    if (!l.numero) falha('VALIDACAO', 'Informe o número do lote.');
    if (!l.descricao) falha('VALIDACAO', 'Informe a descrição do lote.');
    if (todos.some(function (x) { return x.numero === l.numero && x.id !== l.id; })) falha('VALIDACAO', 'Já existe o lote ' + l.numero + '.');
    if (antes) {
      conferirSenha(ses, req.senha);
      var base = dadosCompletos(repo);
      base.lotes = base.lotes.map(function (x) { return x.id === l.id ? l : x; });
      var it = L.financeiro(base).lotes.filter(function (x) { return x.lote.id === l.id; })[0];
      if (l.valor > 0 && it && it.saldo < -0.004) falha('SALDO', 'O valor informado é menor que as notas já lançadas neste lote.');
    } else l.id = 'LOTE' + repo.uuid().slice(0, 6).toUpperCase();
    repo.salvar('Lotes', l);
    repo.historico([hist(repo, ses, antes ? 'Lote alterado' : 'Lote cadastrado', '', 'Lote ' + l.numero, antes ? antes.descricao + ' / ' + antes.valor : '', l.descricao + ' / ' + l.valor, req.motivo)]);
    return { id: l.id, dados: montarDados(repo, ses) };
  };
  A.excluirLote = function (repo, req) {
    var ses = sessao(repo, req.token);
    exigir(ses.perfil.financeiro || ses.perfil.configuracoes, 'Seu perfil não permite excluir lotes.');
    conferirSenha(ses, req.senha);
    var l = repo.listar('Lotes').filter(function (x) { return x.id === req.id; })[0];
    if (!l) falha('VALIDACAO', 'Lote não encontrado.');
    if (repo.listar('Demandas').some(function (d) { return d.loteId === l.id; })) falha('VALIDACAO', 'Há demandas vinculadas a este lote. Mude o lote dessas demandas antes de excluí-lo.');
    repo.remover('Lotes', l.id);
    repo.historico([hist(repo, ses, 'Lote excluído', '', 'Lote ' + l.numero, l.descricao, '', req.motivo)]);
    return { dados: montarDados(repo, ses) };
  };

  /* ---------------- Configurações ---------------- */
  A.salvarConfig = function (repo, req) {
    var ses = sessao(repo, req.token);
    exigir(ses.perfil.configuracoes, 'Seu perfil não permite alterar as configurações.');
    var atual = repo.config(), novo = req.config || {}, registros = [];
    var permitidas = ['orgao', 'contratoGestao', 'contratoExecucao', 'contratada', 'vigenciaInicio', 'vigenciaFim', 'valorGlobal', 'alertaPct', 'setores', 'locais', 'emailsBackup', 'backupAutomatico'];
    var muda = permitidas.filter(function (k) { return novo[k] !== undefined && L.valorTexto(novo[k]) !== L.valorTexto(atual[k]); });
    if (!muda.length) return { semAlteracao: true, dados: montarDados(repo, ses) };
    if (muda.indexOf('valorGlobal') >= 0 || muda.indexOf('alertaPct') >= 0) conferirSenha(ses, req.senha);
    muda.forEach(function (k) {
      var v = novo[k];
      if (L.CONFIG_TIPOS[k] === 'num') v = Number(v) || 0;
      if (L.CONFIG_TIPOS[k] === 'bool') v = v === true || v === 'true';
      if (L.CONFIG_TIPOS[k] === 'lista') v = (Array.isArray(v) ? v : String(v).split(/\n|;/)).map(function (x) { return String(x).trim(); }).filter(function (x) { return x; });
      registros.push(hist(repo, ses, 'Configuração alterada', '', k, L.valorTexto(atual[k]), L.valorTexto(v), req.motivo));
      atual[k] = v;
    });
    if (atual.alertaPct < 1 || atual.alertaPct > 90) falha('VALIDACAO', 'O percentual de alerta deve ficar entre 1 e 90.');
    repo.salvarConfig(atual);
    repo.historico(registros);
    return { dados: montarDados(repo, ses) };
  };

  /* ---------------- Usuários e perfis ---------------- */

  /* ---------------- Gravação com senha quando exigido ---------------- */
  T.salvar = function (nova, antes, auth) {
    nova = L.normalizar('Demandas', nova);
    var an = antes ? L.analisarAlteracao(L.normalizar('Demandas', antes), nova) : { mudancas: [1], exigeSenha: false };
    if (!an.mudancas.length) { U.toast('Nenhuma alteração para salvar.'); return Promise.resolve({ semAlteracao: true }); }
    var p = an.exigeSenha && !auth ? UI.autorizar() : Promise.resolve(auth || null);
    return p.then(function (a) {
      if (an.exigeSenha && !a) return null;
      return Api.chamar('salvarDemanda', { demanda: nova, senha: a ? a.senha : '', motivo: a ? a.motivo : '' }).then(function (r) { U.toast('Demanda ' + (r.id || nova.id) + ' salva.', 'ok'); return r; });
    });
  };
  function copia(d) { return JSON.parse(JSON.stringify(d)); }

  /* Modal com os campos de uma etapa */

    if (e.id === 'aprovacao') f = '<label class="f"><span class="req">Data da aprovação</span><input class="in" type="date" name="aprovacaoData" value="' + v('aprovacaoData', hoje) + '"></label><label class="f full">Observação<textarea class="in" name="aprovacaoObs" rows="2">' + v('aprovacaoObs') + '</textarea></label>';
    if (e.id === 'execucao') f = '<label class="f"><span class="req">Início da execução</span><input class="in" type="date" name="execucaoInicio" value="' + v('execucaoInicio', d.inicioPrevisto && d.inicioPrevisto <= hoje ? d.inicioPrevisto : hoje) + '"></label><label class="f"><span class="req">Término da execução</span><input class="in" type="date" name="execucaoFim" value="' + v('execucaoFim', hoje) + '"></label>';
    if (e.id === 'ateste') f = '<label class="f"><span class="req">Data do ateste</span><input class="in" type="date" name="atesteData" value="' + v('atesteData', hoje) + '"></label><label class="f"><span class="req">Valor atestado (R$)</span><input class="in" type="number" min="0" step="0.01" name="atesteValor" value="' + U.esc(d.atesteValor || d.valorEstimado || '') + '"></label>';
    if (e.id === 'pagamento') f = '<label class="f"><span class="req">Data do pagamento</span><input class="in" type="date" name="pagamentoData" value="' + v('pagamentoData', hoje) + '"></label><p class="calc full">Notas fiscais desta demanda: <b>' + U.brl(App.fin.nfPorDemanda[d.id] || 0) + '</b></p>';
    UI.modal({
      title: (editar ? 'Editar etapa: ' : 'Marcar etapa: ') + e.nome + ' (' + d.id + ')', size: 'md', ok: editar ? 'Salvar alteração' : 'Marcar etapa',
      body: '<div class="fgrid">' + f + (editar ? '<label class="check full"><input type="checkbox" name="manter" checked><span>Etapa concluída (desmarque para reabrir a etapa)</span></label>' : '') + '</div>',
      onOk: function (w) {
        var n = copia(d);
        U.$$('[name]', w).forEach(function (i) { if (i.name !== 'manter') n[i.name] = i.type === 'number' ? Number(i.value) || 0 : i.value; });
        var manter = editar ? w.querySelector('[name=manter]').checked : true;
        n[e.id + 'Ok'] = manter;
        if (!manter) e.campos.forEach(function (c) { if (c !== e.id + 'Ok' && c !== 'execucaoInicio') n[c] = c === 'atesteValor' ? 0 : ''; });
        var erros = L.validarEtapas(n, nfsDe(d.id).length);
        if (erros.length) { w.erro(erros.join(' ')); return false; }

      }
    });
  }
  function modalInicioExec(d) {
    UI.modal({
      title: 'Início da execução (' + d.id + ')', size: 'sm', ok: 'Salvar',
      body: '<label class="f"><span class="req">Data de início</span><input class="in" type="date" name="ini" value="' + U.esc(d.execucaoInicio || L.hoje()) + '"></label><p class="calc" style="margin-top:10px">A demanda passa para "Em execução". Marque a etapa Execução ao concluir o serviço.</p>' +

    });
  }

  /* Nota fiscal */
  function modalNF(d, nf, auth) {
    var fin = App.fin, editando = !!nf;
    nf = nf || { demandaId: d.id, numero: '', valor: Math.max(0, (d.atesteValor || d.valorEstimado) - (fin.nfPorDemanda[d.id] || 0)), data: L.hoje(), empenhoId: '', obs: '' };
    var opcoes = [];
    fin.empenhos.forEach(function (fam) {
      fam.membros.forEach(function (m) { opcoes.push({ v: m.id, l: m.numero + (m.tipo === 'Reforço' ? ' (reforço de ' + fam.empenho.numero + ')' : ' (novo)') + ' · saldo ' + U.brl(fam.saldo + (editando && fam.ids.indexOf(nf.empenhoId) >= 0 ? nf.valor : 0)) }); });
    });
    if (!opcoes.length) { U.toast('Cadastre um empenho em Área do Gestor > Configurações antes de registrar notas.', 'erro'); return; }
    var w = UI.modal({
      title: (editando ? 'Editar Nota Fiscal' : 'Registrar Nota Fiscal') + ' (' + d.id + ')', size: 'md', ok: editando ? 'Salvar alteração' : 'Registrar nota',
      body: '<div class="fgrid"><label class="f"><span class="req">Nº da Nota Fiscal</span><input class="in" name="numero" value="' + U.esc(nf.numero) + '"></label>' +
        '<label class="f"><span class="req">Valor do serviço (R$)</span><input class="in" name="valor" type="number" min="0" step="0.01" value="' + U.esc(nf.valor || '') + '"></label>' +
        '<label class="f"><span class="req">Data de emissão</span><input class="in" name="data" type="date" value="' + U.esc(nf.data) + '"></label>' +
        '<label class="f"><span class="req">Empenho</span><select class="in" name="empenhoId">' + U.opts(opcoes, nf.empenhoId, 'Selecione o empenho') + '</select></label>' +
        '<label class="f full">Observação<input class="in" name="obs" value="' + U.esc(nf.obs) + '"></label><p class="calc full" id="nf-calc"></p></div>',
      onOk: function (w) {
        var n = Object.assign({}, nf);
        U.$$('[name]', w).forEach(function (i) { n[i.name] = i.name === 'valor' ? Number(i.value) || 0 : i.value.trim(); });
        if (!n.numero || !(n.valor > 0) || !n.data || !n.empenhoId) { w.erro('Preencha número, valor, data e empenho.'); return false; }
        var precisa = editando || d.pagamentoOk;
        var p = precisa && !auth ? UI.autorizar('Notas fiscais já registradas, ou de demandas pagas, só são alteradas com senha.') : Promise.resolve(auth || null);
        return p.then(function (a) {
          if (precisa && !a) return false;
          return Api.chamar('salvarNF', { nf: n, senha: a ? a.senha : '', motivo: a ? a.motivo : '' }).then(function () { U.toast('Nota Fiscal ' + n.numero + ' salva. Valor deduzido do empenho e do saldo global.', 'ok'); return true; });
        });
      }
    });
    var calc = function () {
      var emp = w.querySelector('[name=empenhoId]').value, val = Number(w.querySelector('[name=valor]').value) || 0, fam = L.familiaDoEmpenho(fin, emp), el = w.querySelector('#nf-calc');
      if (!fam) { el.innerHTML = 'Selecione o empenho para ver o saldo.'; return; }
      var saldo = fam.saldo + (editando && fam.ids.indexOf(nf.empenhoId) >= 0 ? nf.valor : 0) - val;
      el.innerHTML = 'Saldo do empenho ' + U.esc(fam.empenho.numero) + ' após esta nota: <b style="color:' + (saldo < 0 ? 'var(--bad)' : 'inherit') + '">' + U.brl(saldo) + '</b>' + (saldo < 0 ? ' (insuficiente: cadastre um reforço)' : '') +
        ' · Saldo global após a nota: <b>' + U.brl(fin.global.saldo - val + (editando ? nf.valor : 0)) + '</b>';
    };
    w.querySelector('[name=empenhoId]').onchange = calc; w.querySelector('[name=valor]').oninput = calc; calc();
  }

  function cliqueDetalhe(ev) {
    var b = ev.target.closest('[data-a]'); if (!b) return;
    var d = dem(aberta); if (!d) return;
    var a = b.dataset.a, e = L.ETAPAS.filter(function (x) { return x.id === b.dataset.e; })[0];
    if (a === 'fechar') T.fechar();
    if (a === 'editar') T.form(d);
    if (a === 'inicioExec') modalInicioExec(d);
    if (a === 'editarEtapa') UI.autorizar('A etapa "' + e.nome + '" já foi marcada. A alteração exige a sua senha e fica registrada no histórico.').then(function (au) { if (au) modalEtapa(d, e, true, au); });
    if (a === 'novaNF') modalNF(d);
    if (a === 'editarNF') { var nf = nfsDe(d.id).filter(function (x) { return x.id === b.dataset.id; })[0]; UI.autorizar('Esta Nota Fiscal já foi registrada. A alteração exige a sua senha.').then(function (au) { if (au) modalNF(d, nf, au); }); }
    if (a === 'excluirNF') { var n2 = nfsDe(d.id).filter(function (x) { return x.id === b.dataset.id; })[0];
      UI.autorizar('A Nota Fiscal ' + U.esc(n2.numero) + ' (' + U.brl(n2.valor) + ') será excluída e o valor volta ao saldo do empenho.').then(function (au) { if (au) Api.chamar('excluirNF', { id: n2.id, senha: au.senha, motivo: au.motivo }).then(function () { U.toast('Nota Fiscal excluída.'); }, UI.erro); }); }
    if (a === 'cancelar') UI.modal({ title: 'Cancelar demanda ' + d.id, size: 'sm', ok: 'Cancelar demanda', danger: true, cancel: 'Voltar',
      body: '<label class="f"><span class="req">Motivo do cancelamento</span><textarea class="in" id="mc" rows="3"></textarea></label>',
      onOk: function (w) { var m = w.querySelector('#mc').value.trim(); if (!m) { w.erro('Informe o motivo.'); return false; } var n = copia(d); n.cancelada = true; n.motivoCancelamento = m; return T.salvar(n, d).then(function (r) { return !!r; }); } });
    if (a === 'reativar') { var n3 = copia(d); n3.cancelada = false; n3.motivoCancelamento = ''; T.salvar(n3, d).catch(UI.erro); }
    if (a === 'excluir') UI.confirmar('Excluir demanda', 'A demanda ' + U.esc(d.id) + ' será removida da planilha. Prefira "Cancelar demanda" para manter o registro. Deseja continuar?', 'Sim, excluir', true)
      .then(function (ok) { return ok ? UI.pedirSenha('Confirme a exclusão', 'Informe o motivo e a sua senha.', true) : null; })
      .then(function (au) { if (au) Api.chamar('excluirDemanda', { id: d.id, senha: au.senha, motivo: au.motivo }).then(function () { T.fechar(); U.toast('Demanda excluída.'); }, UI.erro); });
    if (a === 'imprimir') { if (window.G) { G.st.rep = 'ficha'; G.st.repDemanda = d.id; G.st.tab = 'relatorios'; } if (App.P.areaGestor) location.hash = '#gestor'; else U.toast('A ficha impressa fica na Área do Gestor.'); }
  }
  function mudancaDetalhe(ev) {
    var t = ev.target; if (!t.dataset.etapa) return;
    var d = dem(aberta), e = L.ETAPAS.filter(function (x) { return x.id === t.dataset.etapa; })[0];

    if (!d[e.id + 'Ok']) { modalEtapa(d, e, false); return; }

      T.salvar(n, d, au).catch(UI.erro);
    });
  }

      sel('local', 'Imóvel ou Unidade de Conservação', cfg.locais, true) + inp('localInterno', 'Localização interna (bloco, pavimento, sala)') +
      '<div class="f full"><span style="font-size:13px;font-weight:600;color:var(--ink-2)">Setores atendidos</span><div class="chips">' + cfg.setores.map(function (s) { return '<label><input type="checkbox" name="setores" value="' + U.esc(s) + '"' + (d.setores.indexOf(s) >= 0 ? ' checked' : '') + dis('setores') + '>' + U.esc(s) + '</label>'; }).join('') + '</div></div>' +
      inp('responsavelLocal', 'Responsável pelo acompanhamento local', 'text', true) + inp('pessoas', 'Pessoas impactadas (aprox.)', 'number') + '</div></fieldset>' +
      '<fieldset class="fs"><legend>Problema</legend><div class="fgrid">' + sel('sistema', 'Sistema afetado', L.SISTEMAS, true) +
